<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>할 일 관리</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
  
  <!-- Firebase SDK 모듈 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get, remove, child, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDYTzXhT0nEBFGaKy_RylkGJ28rmhsPqoc",
      authDomain: "sunhong-todo.firebaseapp.com",
      databaseURL: "https://sunhong-todo-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "sunhong-todo",
      storageBucket: "sunhong-todo.firebasestorage.app",
      messagingSenderId: "382912248399",
      appId: "1:382912248399:web:1294528d4a9e52f47a083a",
      measurementId: "G-X7FNCNVZZ6"
    };

    try {
      if (firebaseConfig.apiKey && firebaseConfig.apiKey !== "YOUR_API_KEY") {
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.firebaseDb = db;
        window.dbRef = ref;
        window.dbSet = set;
        window.dbGet = get;
        window.dbRemove = remove;
        window.dbChild = child;
        window.dbOnValue = onValue;
      }
    } catch (e) {
      console.warn("Firebase Config 오류 - 로컬 저장소 모드로 작동합니다:", e);
    }

    window.dispatchEvent(new Event('firebase-ready'));
  </script>

  <style>
    .touch-target { min-height: 44px; }
    .tooltip-box {
      display: none;
      position: absolute;
      bottom: 125%;
      left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
      z-index: 50;
    }
    .has-tooltip:hover .tooltip-box,
    .has-tooltip.active-tooltip .tooltip-box {
      display: block;
    }
  </style>
</head>
<body class="bg-slate-100 dark:bg-slate-900 min-h-screen text-slate-800 dark:text-slate-100 p-3 sm:p-5 pb-36 transition-colors duration-200 text-sm sm:text-base">

  <!-- 1. 로그인 / 회원가입 / 관리자 진입 화면 -->
  <div id="loginScreen" class="max-w-lg mx-auto mt-8 sm:mt-12 bg-white dark:bg-slate-800 rounded-xl shadow-md p-6 sm:p-7 border border-slate-200 dark:border-slate-700">
    <div class="text-center mb-5">
      <h2 class="text-2xl font-bold text-slate-800 dark:text-slate-100">할 일 관리</h2>
      <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">아이디와 비밀번호로 로그인하세요.</p>
    </div>

    <div class="flex border-b border-slate-200 dark:border-slate-700 mb-5">
      <button id="tabLogin" type="button" onclick="switchAuthTab('login')" class="flex-1 py-2.5 text-center font-semibold text-indigo-600 dark:text-indigo-400 border-b-2 border-indigo-600 dark:border-indigo-400 text-sm sm:text-base">로그인</button>
      <button id="tabRegister" type="button" onclick="switchAuthTab('register')" class="flex-1 py-2.5 text-center font-semibold text-slate-400 border-b-2 border-transparent hover:text-slate-600 text-sm sm:text-base">회원가입</button>
    </div>

    <form id="loginForm" onsubmit="handleLoginSubmit(event)" class="space-y-3.5">
      <div id="accountListContainer" class="hidden mb-3">

        <div id="accountList" class="flex flex-wrap gap-2"></div>
      </div>

      <div>
        <label class="block text-sm font-semibold text-slate-600 dark:text-slate-400 mb-1">아이디</label>
        <input type="text" id="loginUsername" placeholder="아이디 입력" required

      </div>
      <div>
        <label class="block text-sm font-semibold text-slate-600 dark:text-slate-400 mb-1">비밀번호</label>
        <input type="password" id="loginPassword" placeholder="비밀번호 입력" required

      <div class="text-center pt-2">

    </form>

    <form id="registerForm" onsubmit="handleRegisterSubmit(event)" class="space-y-3.5 hidden">

        <label class="block text-sm font-semibold text-slate-600 dark:text-slate-400 mb-1">새 아이디</label>
        <input type="text" id="regUsername" placeholder="사용할 아이디" required

      </div>
      <div>
        <label class="block text-sm font-semibold text-slate-600 dark:text-slate-400 mb-1">비밀번호</label>
        <input type="password" id="regPassword" placeholder="비밀번호 설정" required

  <!-- 2. 메인 서비스 화면 -->

            <button type="button" id="btnMobile_today17" onclick="setQuickTime('today17', 'mobile')" class="quick-chip-mobile px-3 py-1.5 rounded-full text-sm flex-shrink-0 transition border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-700 text-slate-600 dark:text-slate-300">오늘 17시</button>
            <button type="button" id="btnMobile_tomorrow11" onclick="setQuickTime('tomorrow11', 'mobile')" class="quick-chip-mobile px-3 py-1.5 rounded-full text-sm flex-shrink-0 transition border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-700 text-slate-600 dark:text-slate-300">내일 11시</button>
            <button type="button" id="btnMobile_tomorrow17" onclick="setQuickTime('tomorrow17', 'mobile')" class="quick-chip-mobile px-3 py-1.5 rounded-full text-sm flex-shrink-0 transition border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-700 text-slate-600 dark:text-slate-300">내일 17시</button>

          <div class="flex flex-wrap items-center gap-2">
            <select id="categoryInputMobile" onchange="handleCategoryChange(this.value, 'mobile')" class="px-3 py-2.5 border border-slate-200 dark:border-slate-700 rounded-lg text-sm bg-slate-50 dark:bg-slate-700 font-bold text-indigo-600 dark:text-indigo-400 touch-target">

            </select>

            <input type="datetime-local" id="timeInputMobile" step="60" class="flex-1 px-3 py-2.5 border border-slate-200 dark:border-slate-700 rounded-lg text-sm bg-slate-50 dark:bg-slate-700 touch-target">

            <div id="mobileRoutineOptions" class="hidden flex items-center gap-2 flex-1">
              <select id="mobileRoutineFreq" onchange="handleRoutineFreqChange(this.value, 'mobile')" class="px-3 py-2.5 text-sm border border-slate-200 dark:border-slate-700 rounded-lg bg-slate-50 dark:bg-slate-700 touch-target">
                <option value="매일">매일</option>
                <option value="매주">매주</option>
                <option value="매월">매월</option>
              </select>
              <select id="mobileRoutineDay" class="hidden px-3 py-2.5 text-sm border border-slate-200 dark:border-slate-700 rounded-lg bg-slate-50 dark:bg-slate-700 touch-target">
                <option value="all">전체 요일</option>
                <option value="1">월</option><option value="2">화</option><option value="3">수</option><option value="4">목</option><option value="5">금</option><option value="6">토</option><option value="0">일</option>

                 class="flex-1 px-4 py-3 border border-slate-200 dark:border-slate-700 rounded-xl text-base focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-slate-50 dark:bg-slate-700 touch-target">
          
          <button type="button" onclick="toggleMobileOptions()" class="p-3 text-slate-500 hover:text-slate-700 text-base font-semibold rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-700 touch-target flex items-center justify-center">
            ⚙️

          <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-5 py-3 rounded-xl text-base shadow-2xs touch-target flex-shrink-0">

        </div>

  <script>
    let currentUser = localStorage.getItem('sunhong_todo_user') || '';
    let savedAccounts = JSON.parse(localStorage.getItem('sunhong_todo_accounts') || '[]');
    let localUsers = JSON.parse(localStorage.getItem('sunhong_todo_user_db') || '{}');
    let todos = [];
    let routines = [];
    let currentTab = 'all';
    
    let currentSort = localStorage.getItem('sunhong_todo_sort') || 'createdAt';
    let hideCompleted = localStorage.getItem('sunhong_todo_hide_completed') === 'true';

    let swRegistration = null;

    if (localStorage.getItem('sunhong_theme') === 'dark' || (!('sunhong_theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }

    function toggleDarkMode() {
      if (document.documentElement.classList.contains('dark')) {
        document.documentElement.classList.remove('dark');
        localStorage.setItem('sunhong_theme', 'light');
      } else {
        document.documentElement.classList.add('dark');
        localStorage.setItem('sunhong_theme', 'dark');
      }
      updateDarkModeBtnUI();
    }

    function updateDarkModeBtnUI() {
      const icon = document.getElementById('darkModeIcon');
      if (!icon) return;
      if (document.documentElement.classList.contains('dark')) {
        icon.innerText = "☀️ 주간";
      } else {
        icon.innerText = "🌙 야간";
      }
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').then(reg => { 
        swRegistration = reg;
        updateNotificationUI();
      }).catch(err => console.warn('SW 미등록 상태로 작동합니다.'));
    }

    window.addEventListener('firebase-ready', () => {
      if (currentUser) {
        setupFirebaseListener();
      }
    });

    function toggleKebabMenu(event, menuId) {
      event.stopPropagation();
      const allMenus = document.querySelectorAll('.kebab-dropdown');
      allMenus.forEach(m => {
        if (m.id !== menuId) m.classList.add('hidden');
      });
      const targetMenu = document.getElementById(menuId);
      if (targetMenu) {
        targetMenu.classList.toggle('hidden');
      }
    }

    document.addEventListener('click', () => {
      document.querySelectorAll('.kebab-dropdown').forEach(m => m.classList.add('hidden'));
    });

    function handleNaturalLanguageInput(mode) {
      const categoryVal = document.getElementById('categoryInputMobile').value;
      if (categoryVal === 'routine') return;

      const inputElem = document.getElementById('taskInputMobile');
      if (!inputElem) return;

      const text = inputElem.value;
      const now = new Date();
      let targetDate = new Date();
      let matched = false;

      if (text.includes('모레')) {
        targetDate.setDate(now.getDate() + 2);
        matched = true;
      } else if (text.includes('내일')) {
        targetDate.setDate(now.getDate() + 1);
        matched = true;
      } else if (text.includes('오늘')) {
        matched = true;
      }

      const relativeHourMatch = text.match(/(\d+)\s*시간\s*(뒤|후)/);
      if (relativeHourMatch) {
        const hoursToAdd = parseInt(relativeHourMatch[1], 10);
        targetDate = new Date(now.getTime() + hoursToAdd * 60 * 60 * 1000);
        matched = true;
      } else {
        const isPm = text.includes('오후') || text.includes('저녁') || text.includes('밤');
        const isAm = text.includes('오전') || text.includes('아침');

        const timeMatch = text.match(/(\d{1,2})\s*시(?:\s*(\d{1,2})\s*분?)?/);
        if (timeMatch) {
          let hours = parseInt(timeMatch[1], 10);
          const minutes = timeMatch[2] ? parseInt(timeMatch[2], 10) : 0;

          if (isPm && hours < 12) {
            hours += 12;
          } else if (isAm && hours === 12) {
            hours = 0;
          } else if (!isAm && !isPm && hours < 8 && hours !== 0) {
            hours += 12;
          }

          targetDate.setHours(hours, minutes, 0, 0);
          matched = true;
        }
      }

      if (matched) {
        const year = targetDate.getFullYear();
        const month = String(targetDate.getMonth() + 1).padStart(2, '0');
        const day = String(targetDate.getDate()).padStart(2, '0');
        const hours = String(targetDate.getHours()).padStart(2, '0');
        const minutes = String(targetDate.getMinutes()).padStart(2, '0');

        const timeStr = `${year}-${month}-${day}T${hours}:${minutes}`;
        document.getElementById('timeInputMobile').value = timeStr;
      }
    }

      e.preventDefault();
      const username = document.getElementById('regUsername').value.trim();
      const password = document.getElementById('regPassword').value;
      const confirmPassword = document.getElementById('regPasswordConfirm').value;

      if (!username || !password) return;
      if (password !== confirmPassword) {
        alert('비밀번호가 일치하지 않습니다.');
        return;
      }

      try {
        if (window.firebaseDb) {
          const userRef = window.dbRef(window.firebaseDb, `users/${username}`);
          const snapshot = await window.dbGet(userRef);

          if (snapshot.exists()) {
            alert('이미 존재하는 아이디입니다.');
            return;
          }
          await window.dbSet(userRef, { password: password, createdAt: Date.now() });
        } else {
          if (localUsers[username]) {
            alert('이미 존재하는 아이디입니다.');
            return;
          }
          localUsers[username] = password;
          localStorage.setItem('sunhong_todo_user_db', JSON.stringify(localUsers));

          savedAccounts.push(username);

      e.preventDefault();
      const username = document.getElementById('loginUsername').value.trim();
      const password = document.getElementById('loginPassword').value;

      if (!username || !password) return;

      try {
        let isSuccess = false;

        if (window.firebaseDb) {
          const userRef = window.dbRef(window.firebaseDb, `users/${username}`);
          const snapshot = await window.dbGet(userRef);

          if (!snapshot.exists()) {
            alert('존재하지 않는 아이디입니다.');

          }
          const userData = snapshot.val();

          }

        localStorage.setItem('sunhong_todo_user', currentUser);

      if (!confirm(`정말로 [${uname}] 계정을 삭제하시겠습니까? 데이터는 복구되지 않습니다.`)) return;

        const userRoutinesRef = window.dbRef(window.firebaseDb, `routines/${uname}`);
        await window.dbRemove(userRef);

    function addToGoogleCalendar(taskTitle, category, dueString) {
      let startDateStr, endDateStr;

      if (dueString && dueString.includes('T')) {
        const start = new Date(dueString);
        const end = new Date(start.getTime() + 30 * 60 * 1000);
        
        startDateStr = start.toISOString().replace(/-|:|\.\d{3}/g, "");
        endDateStr = end.toISOString().replace(/-|:|\.\d{3}/g, "");
      } else {
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        const dateFormatted = `${year}${month}${day}`;
        startDateStr = dateFormatted;
        endDateStr = dateFormatted;
      }

      const titleParam = encodeURIComponent(`[${category || '할일'}] ${taskTitle}`);
      const detailsParam = encodeURIComponent(`할 일 웹 앱에서 추가된 일정입니다.`);
      
      const gcalUrl = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${titleParam}&dates=${startDateStr}/${endDateStr}&details=${detailsParam}`;
      window.open(gcalUrl, '_blank');
    }

    function checkDueNotifications() {
      if (Notification.permission !== 'granted') return;

      const now = new Date();
      const todayStr = getTodayString();
      let updated = false;

      if (todos.length) {
        todos.forEach(t => {
          const hasSub = t.subitems && t.subitems.length > 0;
          if (!hasSub && !t.completed && t.due) {
            const dueTime = new Date(t.due);
            const diffMinutes = (dueTime - now) / (1000 * 60);

            if (diffMinutes > 0 && diffMinutes <= 10 && !t.notified10m) {
              triggerNotification("마감 10분 전!", `[${t.category || '할일'}] ${t.task} 마감 10분 전입니다.`);
              t.notified10m = true;
              updated = true;
            }

            if (now >= dueTime && (now - dueTime) < 10 * 60 * 1000 && !t.notified) {
              triggerNotification("마감 시간이 되었습니다!", `[${t.category || '할일'}] ${t.task} 마감 시각이 되었습니다.`);
              t.notified = true;
              t.notified10m = true;
              updated = true;
            }
          }

          if (hasSub) {
            t.subitems.forEach(s => {
              if (!s.completed && s.due) {
                const subDueTime = new Date(s.due);
                const subDiffMinutes = (subDueTime - now) / (1000 * 60);

                if (subDiffMinutes > 0 && subDiffMinutes <= 10 && !s.notified10m) {
                  triggerNotification("하위 할 일 10분 전!", `[하위] ${s.task} 마감 10분 전입니다.`);
                  s.notified10m = true;
                  updated = true;
                }

                if (now >= subDueTime && (now - subDueTime) < 10 * 60 * 1000 && !s.notified) {
                  triggerNotification("하위 할 일 마감!", `[하위] ${s.task} 마감 시각이 되었습니다.`);
                  s.notified = true;
                  s.notified10m = true;
                  updated = true;
                }
              }
            });
          }
        });
      }

      if (routines.length) {
        routines.forEach(r => {
          if (isRoutineDueToday(r) && r.lastCompletedDate !== todayStr && r.dueTime && r.dueTime.includes(':')) {
            const routineDueTime = new Date(`${todayStr}T${r.dueTime}`);
            if (!isNaN(routineDueTime.getTime())) {
              const diffMinutes = (routineDueTime - now) / (1000 * 60);

              if (diffMinutes > 0 && diffMinutes <= 10 && !r.notified10m) {
                triggerNotification("루틴 수행 10분 전!", `[루틴] ${r.task} 수행 10분 전입니다.`);
                r.notified10m = true;
                updated = true;
              }

              if (now >= routineDueTime && (now - routineDueTime) < 10 * 60 * 1000 && !r.notified) {
                triggerNotification("루틴 수행 시간입니다!", `[루틴] ${r.task} 수행 시각이 되었습니다.`);
                r.notified = true;
                r.notified10m = true;
                updated = true;
              }
            }
          }
        });
      }

      if (updated) {
        saveAndRender();
      }
    }
    setInterval(checkDueNotifications, 3000);

      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');

      return `${year}-${month}-${day}T${hours}:${minutes}`;

    function extractAllTodos(rawData) {
      if (!rawData) return [];
      let extracted = [];

      function parseRecursive(val) {
        if (!val) return;
        if (Array.isArray(val)) {
          val.forEach(item => parseRecursive(item));
        } else if (typeof val === 'object') {
          if (val.task || val.text || val.title) {
            const subList = Array.isArray(val.subitems) ? val.subitems.map(s => ({
              id: s.id || Date.now() + Math.random(),
              task: s.task || s.text || s.title || '',
              due: s.due || s.dueDate || '',
              completed: !!s.completed,
              isEditing: false,
              notified: !!s.notified,
              notified10m: !!s.notified10m
            })) : [];

            extracted.push({
              id: val.id || Date.now() + Math.random(),
              task: val.task || val.text || val.title || '내용 없음',
              due: subList.length > 0 ? '' : (val.due || val.dueDate || val.date || ''),
              category: val.category || '할일',
              completed: !!val.completed,
              isEditing: false,
              isAddingSub: false,
              notified: !!val.notified,
              notified10m: !!val.notified10m,
              subitems: subList
            });
          } else {
            Object.values(val).forEach(child => parseRecursive(child));
          }
        }
      }

      parseRecursive(rawData);
      return extracted;
    }

    function extractAllRoutines(rawData) {
      if (!rawData) return [];
      let extracted = [];

      function parseRecursive(val) {
        if (!val) return;
        if (Array.isArray(val)) {
          val.forEach(item => parseRecursive(item));
        } else if (typeof val === 'object') {
          if (val.task || val.text || val.title) {
            extracted.push({
              id: val.id || Date.now() + Math.random(),
              task: val.task || val.text || val.title || '',
              freq: val.freq || '매일',
              dayVal: val.dayVal || '',
              dueTime: val.dueTime || val.time || '',
              lastCompletedDate: val.lastCompletedDate || null,
              notified: !!val.notified,
              notified10m: !!val.notified10m,
              isEditing: false
            });
          } else {
            Object.values(val).forEach(child => parseRecursive(child));
          }
        }
      }

      parseRecursive(rawData);
      return extracted;
    }

    function setupFirebaseListener() {
      if (!window.firebaseDb || !currentUser) return;
      
      const userTodosRef = window.dbRef(window.firebaseDb, `todos/${currentUser}`);
      window.dbOnValue(userTodosRef, (snapshot) => {
        const data = snapshot.val();
        todos = extractAllTodos(data);
        localStorage.setItem(`sunhong_todos_${currentUser}`, JSON.stringify(todos));
        render();
      });

      const userRoutinesRef = window.dbRef(window.firebaseDb, `routines/${currentUser}`);
      window.dbOnValue(userRoutinesRef, (snapshot) => {
        const data = snapshot.val();
        routines = extractAllRoutines(data);
        localStorage.setItem(`sunhong_routines_${currentUser}`, JSON.stringify(routines));
        render();
      });
    }

    function syncToFirebase() {
      if (!window.firebaseDb || !currentUser) return;
      window.dbSet(window.dbRef(window.firebaseDb, `todos/${currentUser}`), todos);
      window.dbSet(window.dbRef(window.firebaseDb, `routines/${currentUser}`), routines);

    function saveAndRender() {

        localStorage.setItem(`sunhong_todos_${currentUser}`, JSON.stringify(todos));

    function exportCsv() {
      if (!todos.length && !routines.length) { 
        alert('내보낼 데이터가 없습니다.'); 
        return; 
      }

      const rows = [
        ['유형', '상위/그룹명', '항목명', '마감일시/주기', '완료여부']
      ];

      todos.forEach(t => {
        const hasSub = t.subitems && t.subitems.length > 0;
        rows.push([
          hasSub ? '그룹 할일' : '일반 할일',
          '',
          t.task,
          t.due || '',
          t.completed ? '완료' : '미완료'
        ]);

        if (hasSub) {
          t.subitems.forEach(s => {
            rows.push([
              '하위 할일',
              t.task,
              s.task,
              s.due || '',
              s.completed ? '완료' : '미완료'
            ]);
          });
        }
      });

      routines.forEach(r => {
        const freqDetail = r.freq + (r.dayVal ? `(${r.dayVal})` : '') + (r.dueTime ? ` ${r.dueTime}` : '');
        rows.push([
          '루틴',
          '',
          r.task,
          freqDetail,
          r.lastCompletedDate === getTodayString() ? '오늘 완료' : '미완료'
        ]);
      });

      const csvContent = rows.map(row => 
        row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(',')
      ).join('\n');

      const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      
      const link = document.createElement('a');
      link.setAttribute('href', url);
      link.setAttribute('download', `todo_export_${currentUser}_${getTodayString()}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }

      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (Array.isArray(imported)) {
            todos = extractAllTodos(imported);
          } else if (imported.todos || imported.routines) {
            todos = extractAllTodos(imported.todos);
            routines = extractAllRoutines(imported.routines);
          } else {
            todos = extractAllTodos(imported);
          }
          saveAndRender();
          alert('데이터가 성공적으로 복원되었습니다.');
        } catch (err) {
          alert('파일을 읽는 중 오류가 발생했습니다.');
        }
      };
      reader.readAsText(file);
    }

    function getDDayTag(dateString) {
      if (!dateString) return '';
      const now = new Date();
      now.setHours(0,0,0,0);
      
      const parts = dateString.split('T')[0].split('-');
      if (parts.length !== 3) return '';
      
      const targetDay = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
      targetDay.setHours(0,0,0,0);

      const diffDays = Math.round((targetDay - now) / (1000 * 60 * 60 * 24));
      const fullTarget = new Date(dateString);

      if (new Date() > fullTarget && diffDays <= 0) {
        return `<span title="기한 초과" class="inline-block w-2.5 h-2.5 rounded-full bg-rose-500 flex-shrink-0"></span>`;
      } else if (diffDays === 0) {
        return `<span title="오늘 마감 (D-Day)" class="inline-block w-2.5 h-2.5 rounded-full bg-amber-400 flex-shrink-0"></span>`;
      } else if (diffDays > 0) {
        return `<span title="D-${diffDays}" class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-500 flex-shrink-0"></span>`;
      } else {
        return `<span title="기한 초과" class="inline-block w-2.5 h-2.5 rounded-full bg-rose-500 flex-shrink-0"></span>`;
      }
    }

        dayVal = document.getElementById(`editRoutineMonth_${id}`).value;

      if (!taskInput) return;

      routines = routines.map(r => r.id === id ? {

    function isRoutineDueToday(routine) {
      const now = new Date();
      const currentDayOfWeek = now.getDay();
      const currentDayOfMonth = now.getDate();

      if (routine.freq === '매일') return true;

      if (routine.freq === '매주') {
        if (!routine.dayVal || routine.dayVal === 'all') return true;
        return parseInt(routine.dayVal, 10) === currentDayOfWeek;
      }

      if (routine.freq === '매월') {
        if (!routine.dayVal) return true;
        const targetDay = parseInt(routine.dayVal, 10);
        const lastDayOfCurrentMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();

        if (targetDay > lastDayOfCurrentMonth) {
          return currentDayOfMonth === lastDayOfCurrentMonth;
        }
        return currentDayOfMonth === targetDay;
      }

      return false;
    }

    function isToday(dateString) {
      if (!dateString) return false;
      const todayStr = getTodayString();
      return dateString.startsWith(todayStr);
    }

    function getEarliestDue(todo) {
      if (todo.subitems && todo.subitems.length > 0) {
        const dues = todo.subitems.map(s => s.due).filter(Boolean).sort();
        if (dues.length > 0) return dues[0];
      }
      if (todo.due) return todo.due;
      return '9999-99-99';
    }

    function formatSimpleDue(dueStr) {
      if (!dueStr) return '';
      const d = new Date(dueStr);
      if (isNaN(d.getTime())) return '';
      const month = d.getMonth() + 1;
      const date = d.getDate();
      const hours = String(d.getHours()).padStart(2, '0');
      const minutes = String(d.getMinutes()).padStart(2, '0');
      return `${month}/${date} ${hours}:${minutes}`;
    }

      let filteredTodos = [...todos];

      if (hideCompleted) {
        filteredTodos = filteredTodos.filter(t => !t.completed);

      if (currentSort === 'dueDate') filteredTodos.sort((a, b) => getEarliestDue(a).localeCompare(getEarliestDue(b)));
      else filteredTodos.sort((a, b) => b.id - a.id);

      if (filteredTodos.length === 0) {
        container.innerHTML = `<ul class="space-y-0"><li class="text-center py-4 text-slate-400 text-sm">등록된 할 일이 없습니다.</li></ul>`;

        const prog = hasSub ? Math.round((compSub / totalSub) * 100) : 0;

        return `
          <li class="bg-slate-50 dark:bg-slate-800/90 border border-slate-200/80 dark:border-slate-700/80 rounded-md p-0.5 shadow-2xs transition ${t.completed ? 'opacity-60 bg-slate-100/50 dark:bg-slate-900/40' : ''}">

                      ${hasSub ? `
                        <span class="text-[9px] leading-none font-semibold bg-indigo-100 dark:bg-indigo-950 text-indigo-700 dark:text-indigo-300 px-1 py-0.5 rounded">그룹</span>

                    ⋮
                  </button>
                  <div id="kebab_main_${t.id}" class="kebab-dropdown hidden absolute right-0 top-full mt-1 w-36 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg shadow-lg z-50 py-1 text-xs">
                    <button onclick="addToGoogleCalendar('${t.task.replace(/'/g, "\\'")}', '할일', '${t.due || ''}')" class="w-full text-left px-3 py-1.5 hover:bg-slate-100 dark:hover:bg-slate-700 flex items-center gap-2">
                      <span>📅</span> 캘린더 추가
                    </button>
                    <button onclick="toggleEditMain(${t.id})" class="w-full text-left px-3 py-1.5 hover:bg-slate-100 dark:hover:bg-slate-700 flex items-center gap-2">
                      <span>✏️</span> 수정
                    </button>
                    <button onclick="toggleAddSubForm(${t.id})" class="w-full text-left px-3 py-1.5 hover:bg-slate-100 dark:hover:bg-slate-700 text-indigo-600 dark:text-indigo-400 font-semibold flex items-center gap-2">
                      <span>➕</span> 하위 할일 추가
                    </button>
                    <button onclick="deleteTodo(${t.id})" class="w-full text-left px-3 py-1.5 hover:bg-slate-100 dark:hover:bg-slate-700 text-rose-500 font-semibold flex items-center gap-2">
                      <span>✕</span> 삭제
                    </button>
                  </div>
                </div>
              </div>
            `}

            ${t.isAddingSub ? `
              <div class="mt-1 sm:ml-4 p-1 bg-indigo-50/60 dark:bg-indigo-950/40 rounded border border-indigo-100 dark:border-indigo-900 space-y-1">
                <input type="text" id="subTaskInput_${t.id}" placeholder="하위 할 일 내용" onkeydown="if(event.key==='Enter') saveInlineSubitem(${t.id})"
                       class="w-full px-2 py-1 text-sm sm:text-base border border-indigo-200 dark:border-indigo-800 rounded bg-white dark:bg-slate-800">
                <div class="flex gap-1.5">
                  <input type="datetime-local" id="subDueInput_${t.id}" step="60" class="flex-1 px-2 py-1 text-xs border border-indigo-200 dark:border-indigo-800 rounded bg-white dark:bg-slate-800">
                  <button onclick="saveInlineSubitem(${t.id})" class="px-2.5 py-1 bg-indigo-600 text-white text-xs rounded touch-target">추가</button>
                  <button onclick="toggleAddSubForm(${t.id})" class="px-2.5 py-1 bg-slate-200 dark:bg-slate-700 text-slate-600 dark:text-slate-300 text-xs rounded touch-target">취소</button>
                </div>
              </div>
            ` : ''}

            ${hasSub ? `
              <ul class="mt-0.5 pl-2 sm:pl-4 border-l-2 border-indigo-100 dark:border-indigo-900 space-y-0">
                ${t.subitems.map(s => `
                  <li class="py-0.5">
                    ${s.isEditing ? `
                      <div class="flex items-center gap-1.5 bg-white dark:bg-slate-800 p-0.5 rounded border border-indigo-200 dark:border-indigo-800">
                        <input type="text" id="editSubTask_${s.id}" value="${s.task}" class="flex-1 px-2 py-1 text-sm sm:text-base border border-slate-300 dark:border-slate-600 rounded bg-slate-50 dark:bg-slate-700">
                        <input type="datetime-local" id="editSubDue_${s.id}" step="60" value="${s.due || ''}" class="px-2 py-1 text-xs border border-slate-300 dark:border-slate-600 rounded bg-slate-50 dark:bg-slate-700">
                        <button onclick="saveEditSub(${t.id}, ${s.id})" class="px-2.5 py-1 bg-indigo-600 text-white text-xs rounded touch-target">저장</button>
                        <button onclick="toggleEditSub(${t.id}, ${s.id})" class="px-2.5 py-1 bg-slate-200 dark:bg-slate-700 text-slate-600 dark:text-slate-300 text-xs rounded touch-target">취소</button>
                      </div>
                    ` : `
                      <div class="flex items-center justify-between text-sm sm:text-base">
                        <div class="flex items-center gap-1.5 min-w-0 flex-1">
                          <input type="checkbox" ${s.completed ? 'checked' : ''} onchange="toggleSubitem(${t.id}, ${s.id})" class="w-4 h-4 sm:w-5 sm:h-5 accent-indigo-600 rounded cursor-pointer touch-target flex-shrink-0">
                          <span class="${s.completed ? 'line-through text-slate-400' : 'text-slate-700 dark:text-slate-200'} text-sm sm:text-base break-words">${s.task}</span>
                          ${!s.completed && s.due ? getDDayTag(s.due) : ''}
                          ${s.due ? `<span class="text-xs text-slate-400 ml-1 flex-shrink-0">${formatSimpleDue(s.due)}</span>` : ''}
                        </div>
                        
                        <div class="relative flex-shrink-0">
                          <button onclick="toggleKebabMenu(event, 'kebab_sub_${s.id}')" title="더보기" class="p-0.5 px-1.5 text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-700 rounded transition text-xs touch-target">
                            ⋮
                          </button>
                          <div id="kebab_sub_${s.id}" class="kebab-dropdown hidden absolute right-0 top-full mt-1 w-32 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg shadow-lg z-50 py-1 text-xs">
                            <button onclick="addToGoogleCalendar('${s.task.replace(/'/g, "\\'")}', '하위할일', '${s.due || ''}')" class="w-full text-left px-3 py-1.5 hover:bg-slate-100 dark:hover:bg-slate-700 flex items-center gap-2">
                              <span>📅</span> 캘린더 추가
                            </button>
                            <button onclick="toggleEditSub(${t.id}, ${s.id})" class="w-full text-left px-3 py-1.5 hover:bg-slate-100 dark:hover:bg-slate-700 flex items-center gap-2">
                              <span>✏️</span> 수정
                            </button>
                            <button onclick="deleteSubitem(${t.id}, ${s.id})" class="w-full text-left px-3 py-1.5 hover:bg-slate-100 dark:hover:bg-slate-700 text-rose-500 font-semibold flex items-center gap-2">
                              <span>✕</span> 삭제
                            </button>
                          </div>
                        </div>
                      </div>
                    `}
                  </li>
                `).join('')}
              </ul>
            ` : ''}
          </li>
        `;
      }).join('')}</ul>`;
    }

    function renderTodayTimelineTab(container) {
      const now = new Date();
      const currentHour = now.getHours();
      const currentMinGroup = now.getMinutes() < 30 ? 0 : 30;
      const todayStr = getTodayString();
      
      let todayItems = [];

      todos.forEach(t => {
        const hasSub = t.subitems && t.subitems.length > 0;

        if (!hasSub && isToday(t.due)) {
          if (!hideCompleted || !t.completed) {
            todayItems.push({ ...t, isSub: false, isRoutine: false, parentId: null, parentTask: null });
          }
        }

        if (hasSub) {
          t.subitems.forEach(s => {
            if (isToday(s.due)) {
              if (!hideCompleted || !s.completed) {
                todayItems.push({ ...s, isSub: true, isRoutine: false, parentId: t.id, parentTask: t.task, parentCategory: t.category });
              }
            }
          });
        }
      });

      routines.forEach(r => {
        if (isRoutineDueToday(r)) {
          const isDone = r.lastCompletedDate === todayStr;
          if (!hideCompleted || !isDone) {
            const fullDueStr = r.dueTime ? `${todayStr}T${r.dueTime}` : '';
            todayItems.push({
              id: r.id,
              task: r.task,
              due: fullDueStr,
              category: '루틴',
              completed: isDone,
              isSub: false,
              isRoutine: true,
              freq: r.freq
            });
          }
        }
      });

      const halfHourMap = {};
      for (let h = 0; h < 24; h++) {
        halfHourMap[`${h}_0`] = [];
        halfHourMap[`${h}_30`] = [];
      }
      const noTimeItems = [];

      todayItems.forEach(item => {
        if (!item.due || !item.due.includes('T')) {
          noTimeItems.push(item);
        } else {
          const timeParts = item.due.split('T')[1].split(':');
          const hour = parseInt(timeParts[0], 10);
          const min = parseInt(timeParts[1], 10);
          const slotKey = `${hour}_${min < 30 ? 0 : 30}`;

          if (halfHourMap[slotKey]) halfHourMap[slotKey].push(item);
          else noTimeItems.push(item);
        }
      });

      if (todayItems.length === 0) {
        container.innerHTML = `
          <div class="text-center py-12 bg-slate-50 dark:bg-slate-800/80 border border-slate-200/80 dark:border-slate-700 rounded-xl">
            <p class="text-slate-400 text-sm">오늘 예정된 일정 및 루틴이 없습니다.</p>
          </div>
        `;
        return;
      }

      let html = `<div class="space-y-0.5">`;

      if (noTimeItems.length > 0) {
        html += `
          <div class="bg-indigo-50/50 dark:bg-indigo-950/30 border border-indigo-100 dark:border-indigo-900 rounded-xl p-1 mb-1">
            <h3 class="text-xs font-bold text-indigo-700 dark:text-indigo-300 mb-0.5">오늘 시간 미지정</h3>
            <div class="space-y-0 pl-0.5">
              ${noTimeItems.map(item => renderTimelineItemHtml(item)).join('')}
            </div>
          </div>
        `;
      }

      for (let h = 0; h < 24; h++) {
        [0, 30].forEach(m => {
          const slotKey = `${h}_${m}`;
          const items = halfHourMap[slotKey];
          const isCurrentSlot = h === currentHour && m === currentMinGroup;

          if (items.length > 0 || isCurrentSlot) {
            const timeLabel = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;

            html += `
              <div class="flex items-start gap-1 p-0.5 rounded-lg border transition ${isCurrentSlot ? 'bg-blue-50/60 dark:bg-blue-950/40 border-blue-300 dark:border-blue-700 ring-1 ring-blue-200 dark:ring-blue-800' : 'bg-slate-50/70 dark:bg-slate-800/60 border-slate-200/70 dark:border-slate-700/70'}">
                <div class="w-10 sm:w-12 text-xs font-bold ${isCurrentSlot ? 'text-blue-600 dark:text-blue-400' : 'text-slate-500 dark:text-slate-400'} flex flex-col items-start pt-0.5 flex-shrink-0">
                  <span>${timeLabel}</span>
                  ${isCurrentSlot ? `<span class="text-[8px] leading-tight bg-blue-600 text-white px-1 py-0.5 rounded mt-0.5">LIVE</span>` : ''}
                </div>
                <div class="flex-1 min-h-[22px] space-y-0">
                  ${items.length > 0 ? items.map(item => renderTimelineItemHtml(item)).join('') : `<span class="text-xs text-slate-300 dark:text-slate-600 italic leading-5">일정 없음</span>`}
                </div>
              </div>
            `;
          }
        });
      }

      html += `</div>`;
      container.innerHTML = html;
    }

    function renderTimelineItemHtml(item) {
      if (item.isRoutine) {
        return `
          <div class="flex items-center justify-between text-sm sm:text-base bg-emerald-50/60 dark:bg-emerald-950/30 p-0.5 px-1 rounded border border-emerald-200 dark:border-emerald-800/60 shadow-2xs">
            <div class="flex items-center gap-1.5">
              <input type="checkbox" ${item.completed ? 'checked' : ''} onchange="toggleRoutineToday(${item.id})" class="w-4 h-4 sm:w-5 sm:h-5 accent-emerald-600 rounded cursor-pointer touch-target">
              <span class="${item.completed ? 'line-through text-slate-400' : 'text-slate-800 dark:text-slate-100 font-semibold'} text-sm sm:text-base break-words">${item.task}</span>
              <span class="text-xs bg-emerald-100 dark:bg-emerald-900 text-emerald-700 dark:text-emerald-300 px-1 py-0.5 rounded font-medium">${item.freq}</span>
            </div>
          </div>
        `;
      } else if (item.isSub) {
        const tooltipId = `tooltip_sub_${item.id}`;
        return `
          <div class="flex items-center justify-between text-sm sm:text-base bg-white dark:bg-slate-800 p-0.5 px-1 rounded border border-slate-200 dark:border-slate-700 shadow-2xs">
            <div class="flex items-center gap-1.5">
              <input type="checkbox" ${item.completed ? 'checked' : ''} onchange="toggleSubitem(${item.parentId}, ${item.id})" class="w-4 h-4 sm:w-5 sm:h-5 accent-indigo-600 rounded cursor-pointer touch-target">
              <span class="${item.completed ? 'line-through text-slate-400' : 'text-slate-700 dark:text-slate-200 font-medium'} text-sm sm:text-base break-words">${item.task}</span>
              
              <div id="${tooltipId}" class="relative inline-block has-tooltip cursor-pointer" onclick="toggleSubTooltip(event, '${tooltipId}')">
                <span class="text-[10px] leading-none bg-indigo-50 dark:bg-indigo-950 text-indigo-600 dark:text-indigo-300 px-1 py-0.5 rounded font-semibold border border-indigo-100 dark:border-indigo-800">하위</span>
                <div class="tooltip-box bg-slate-800 dark:bg-slate-900 text-white text-xs px-2 py-0.5 rounded shadow-lg border border-slate-700">
                  📂 그룹: ${item.parentTask || '상위 그룹'}
                </div>
              </div>
            </div>
          </div>
        `;
      } else {
        return `
          <div class="flex items-center justify-between text-sm sm:text-base bg-white dark:bg-slate-800 p-0.5 px-1 rounded border border-slate-200 dark:border-slate-700 shadow-2xs">
            <div class="flex items-center gap-1.5">
              <input type="checkbox" ${item.completed ? 'checked' : ''} onchange="toggleComplete(${item.id})" class="w-4 h-4 sm:w-5 sm:h-5 accent-indigo-600 rounded cursor-pointer touch-target">
              <span class="${item.completed ? 'line-through text-slate-400' : 'text-slate-800 dark:text-slate-100 font-semibold'} text-sm sm:text-base break-words">${item.task}</span>
            </div>
          </div>
        `;
      }
    }

    function renderRoutineTab(container) {
      const todayStr = getTodayString();

      const daysOfWeek = [
        { val: 'all', label: '전체' },
        { val: '1', label: '월' }, { val: '2', label: '화' }, { val: '3', label: '수' },
        { val: '4', label: '목' }, { val: '5', label: '금' }, { val: '6', label: '토' }, { val: '0', label: '일' }
      ];

      container.innerHTML = `
        <div class="space-y-0.5">
          ${routines.length === 0 ? `
            <div class="text-center py-8 bg-slate-50 dark:bg-slate-800/60 border border-slate-200/80 dark:border-slate-700 rounded-lg">
              <p class="text-slate-500 dark:text-slate-400 text-sm font-medium">등록된 습관/반복 루틴이 없습니다.</p>
              <p class="text-slate-400 dark:text-slate-500 text-xs mt-1">하단 입력창에서 카테고리를 <strong class="text-indigo-600 dark:text-indigo-400">[루틴]</strong>으로 선택하여 등록하세요.</p>
            </div>
          ` : `
            <ul class="space-y-0">
              ${routines.map(r => {
                const isDoneToday = r.lastCompletedDate === todayStr;
                const isDueToday = isRoutineDueToday(r);

                let dayLabel = '';
                if (r.freq === '매주') {
                  const found = daysOfWeek.find(d => d.val === r.dayVal);
                  dayLabel = found && found.val !== 'all' ? ` (${found.label}요일)` : ' (매일)';
                } else if (r.freq === '매월') {
                  dayLabel = r.dayVal ? ` (${r.dayVal}일)` : '';
                }

                return `
                  <li class="bg-slate-50 dark:bg-slate-800/90 border border-slate-200 dark:border-slate-700 rounded-md p-0.5 shadow-2xs ${!isDueToday ? 'opacity-50' : ''}">
                    ${r.isEditing ? `
                      <div class="space-y-1 bg-white dark:bg-slate-800 p-1 rounded border border-indigo-200 dark:border-indigo-800">
                        <input type="text" id="editRoutineTask_${r.id}" value="${r.task}" class="w-full px-2 py-1 text-sm sm:text-base border border-slate-300 dark:border-slate-600 rounded bg-slate-50 dark:bg-slate-700">
                        <div class="flex flex-wrap items-center gap-1.5">
                          <select id="editRoutineFreq_${r.id}" onchange="handleRoutineFreqChange(this.value, '', 'editRoutine')" class="px-2 py-1 text-sm sm:text-base border border-slate-300 dark:border-slate-600 rounded bg-white dark:bg-slate-700">
                            <option value="매일" ${r.freq === '매일' ? 'selected' : ''}>매일</option>
                            <option value="매주" ${r.freq === '매주' ? 'selected' : ''}>매주</option>
                            <option value="매월" ${r.freq === '매월' ? 'selected' : ''}>매월</option>
                          </select>
                          
                          <select id="editRoutineDay_${r.id}" class="${r.freq === '매주' ? '' : 'hidden'} px-2 py-1 text-sm sm:text-base border border-slate-300 dark:border-slate-600 rounded bg-white dark:bg-slate-700">
                            <option value="all" ${r.dayVal === 'all' ? 'selected' : ''}>전체</option>
                            <option value="1" ${r.dayVal === '1' ? 'selected' : ''}>월</option>
                            <option value="2" ${r.dayVal === '2' ? 'selected' : ''}>화</option>
                            <option value="3" ${r.dayVal === '3' ? 'selected' : ''}>수</option>
                            <option value="4" ${r.dayVal === '4' ? 'selected' : ''}>목</option>
                            <option value="5" ${r.dayVal === '5' ? 'selected' : ''}>금</option>
                            <option value="6" ${r.dayVal === '6' ? 'selected' : ''}>토</option>
                            <option value="0" ${r.dayVal === '0' ? 'selected' : ''}>일</option>
                          </select>

                          <select id="editRoutineMonth_${r.id}" class="${r.freq === '매월' ? '' : 'hidden'} px-2 py-1 text-sm sm:text-base border border-slate-300 dark:border-slate-600 rounded bg-white dark:bg-slate-700">
                            ${Array.from({length: 31}, (_, i) => `<option value="${i + 1}" ${parseInt(r.dayVal) === i + 1 ? 'selected' : ''}>${i + 1}일</option>`).join('')}
                          </select>

                          <input type="time" id="editRoutineTime_${r.id}" step="60" value="${r.dueTime || ''}" class="px-2 py-1 text-sm sm:text-base border border-slate-300 dark:border-slate-600 rounded bg-slate-50 dark:bg-slate-700">

                          <button onclick="saveEditRoutine(${r.id})" class="px-2.5 py-1 bg-indigo-600 text-white text-xs sm:text-sm rounded touch-target">저장</button>
                          <button onclick="toggleEditRoutine(${r.id})" class="px-2.5 py-1 bg-slate-200 dark:bg-slate-700 text-slate-600 dark:text-slate-300 text-xs sm:text-sm rounded touch-target">취소</button>
                        </div>
                      </div>
                    ` : `
                      <div class="flex items-center justify-between">
                        <div class="flex items-center gap-2">
                          <input type="checkbox" ${isDoneToday ? 'checked' : ''} onchange="toggleRoutineToday(${r.id})" class="w-4 h-4 sm:w-5 sm:h-5 accent-emerald-600 rounded cursor-pointer touch-target">
                          <div>
                            <div class="flex items-center gap-2">
                              <span class="text-sm sm:text-base font-semibold ${isDoneToday ? 'line-through text-slate-400 dark:text-slate-500' : 'text-slate-800 dark:text-slate-100'} break-words">${r.task}</span>
                              ${r.dueTime ? `<span class="text-xs font-bold text-indigo-600 dark:text-indigo-400">${r.dueTime}</span>` : ''}
                            </div>
                            <div class="flex items-center gap-2 mt-0.5">
                              <span class="text-xs bg-indigo-100 dark:bg-indigo-950 text-indigo-700 dark:text-indigo-300 px-1.5 py-0.2 rounded font-medium">${r.freq}${dayLabel}</span>
                              <span class="text-xs ${isDoneToday ? 'text-emerald-600 dark:text-emerald-400 font-bold' : isDueToday ? 'text-amber-600 font-medium' : 'text-slate-400'}">
                                ${isDoneToday ? '✓ 오늘 달성 완료!' : isDueToday ? '오늘 수행 대상' : '오늘 비대상'}
                              </span>
                            </div>
                          </div>
                        </div>

                        <div class="relative flex-shrink-0">
                          <button onclick="toggleKebabMenu(event, 'kebab_routine_${r.id}')" title="더보기" class="p-1 px-2 text-slate-500 hover:bg-slate-200 dark:hover:bg-slate-700 rounded font-bold transition text-base touch-target">
                            ⋮
                          </button>
                          <div id="kebab_routine_${r.id}" class="kebab-dropdown hidden absolute right-0 top-full mt-1 w-28 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg shadow-lg z-50 py-1 text-xs">
                            <button onclick="toggleEditRoutine(${r.id})" class="w-full text-left px-3 py-1.5 hover:bg-slate-100 dark:hover:bg-slate-700 flex items-center gap-2">
                              <span>✏️</span> 수정
                            </button>
                            <button onclick="deleteRoutine(${r.id})" class="w-full text-left px-3 py-1.5 hover:bg-slate-100 dark:hover:bg-slate-700 text-rose-500 font-semibold flex items-center gap-2">
                              <span>✕</span> 삭제
                            </button>
                          </div>
                        </div>
                      </div>
                    `}
                  </li>
                `;
              }).join('')}
            </ul>
          `}
        </div>
      `;
    }

    initApp();
  </script>
</body>
</html>
