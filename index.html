<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>할 일 관리</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
  
  <!-- Firebase SDK 모듈 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get, remove, child, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDYTzXhT0nEBFGaKy_RylkGJ28rmhsPqoc",
      authDomain: "sunhong-todo.firebaseapp.com",
      databaseURL: "https://sunhong-todo-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "sunhong-todo",
      storageBucket: "sunhong-todo.firebasestorage.app",
      messagingSenderId: "382912248399",
      appId: "1:382912248399:web:1294528d4a9e52f47a083a",
      measurementId: "G-X7FNCNVZZ6"
    };

    try {
      if (firebaseConfig.apiKey && firebaseConfig.apiKey !== "YOUR_API_KEY") {
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.firebaseDb = db;
        window.dbRef = ref;
        window.dbSet = set;
        window.dbGet = get;
        window.dbRemove = remove;
        window.dbChild = child;
        window.dbOnValue = onValue;
      }
    } catch (e) {
      console.warn("Firebase Config 오류 - 로컬 저장소 모드로 작동합니다:", e);
    }

    window.dispatchEvent(new Event('firebase-ready'));
  </script>

  <style>
    .touch-target { min-height: 40px; }
    /* 스마트 툴팁 스타일 */
    .tooltip-box {
      display: none;
      position: absolute;
      bottom: 125%;
      left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
      z-index: 50;
    }
    .has-tooltip:hover .tooltip-box,
    .has-tooltip.active-tooltip .tooltip-box {
      display: block;
    }
  </style>
</head>
<body class="bg-slate-100 dark:bg-slate-900 min-h-screen text-slate-800 dark:text-slate-100 p-3 sm:p-6 pb-24 sm:pb-8 transition-colors duration-200 text-sm sm:text-base">

  <!-- 1. 로그인 / 회원가입 / 관리자 진입 화면 -->
  <div id="loginScreen" class="max-w-md mx-auto mt-8 sm:mt-12 bg-white dark:bg-slate-800 rounded-xl shadow-md p-5 sm:p-7 border border-slate-200 dark:border-slate-700">
    <div class="text-center mb-5">
      <h2 class="text-xl sm:text-2xl font-bold text-slate-800 dark:text-slate-100">할 일 관리</h2>
      <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-1">아이디와 비밀번호로 로그인하세요.</p>
    </div>

    <!-- 탭 선택 (로그인 vs 회원가입) -->
    <div class="flex border-b border-slate-200 dark:border-slate-700 mb-5">
      <button id="tabLogin" type="button" onclick="switchAuthTab('login')" class="flex-1 py-2 text-center font-semibold text-indigo-600 dark:text-indigo-400 border-b-2 border-indigo-600 dark:border-indigo-400 text-xs sm:text-base">로그인</button>
      <button id="tabRegister" type="button" onclick="switchAuthTab('register')" class="flex-1 py-2 text-center font-semibold text-slate-400 border-b-2 border-transparent hover:text-slate-600 text-xs sm:text-base">회원가입</button>
    </div>

    <!-- 로그인 폼 -->
    <form id="loginForm" onsubmit="handleLoginSubmit(event)" class="space-y-3">
      <div id="accountListContainer" class="hidden mb-3">
        <p class="text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1.5">최근 접속 계정</p>
        <div id="accountList" class="flex flex-wrap gap-1.5"></div>
      </div>

      <div>
        <label class="block text-xs sm:text-sm font-semibold text-slate-600 dark:text-slate-400 mb-1">아이디</label>
        <input type="text" id="loginUsername" placeholder="아이디 입력" required
               class="w-full px-3.5 py-2.5 border border-slate-200 dark:border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-slate-50 dark:bg-slate-700 text-xs sm:text-sm">
      </div>
      <div>
        <label class="block text-xs sm:text-sm font-semibold text-slate-600 dark:text-slate-400 mb-1">비밀번호</label>
        <input type="password" id="loginPassword" placeholder="비밀번호 입력" required
               class="w-full px-3.5 py-2.5 border border-slate-200 dark:border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-slate-50 dark:bg-slate-700 text-xs sm:text-sm">
      </div>
      <button type="submit" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg transition text-xs sm:text-sm shadow-xs touch-target">
        로그인
      </button>

      <div class="text-center pt-2">
        <button type="button" onclick="openAdminPrompt()" class="text-xs sm:text-sm text-slate-400 hover:text-indigo-600 underline">
          관리자 모드
        </button>
      </div>
    </form>

    <!-- 회원가입 폼 -->
    <form id="registerForm" onsubmit="handleRegisterSubmit(event)" class="space-y-3 hidden">
      <div>
        <label class="block text-xs sm:text-sm font-semibold text-slate-600 dark:text-slate-400 mb-1">새 아이디</label>
        <input type="text" id="regUsername" placeholder="사용할 아이디" required
               class="w-full px-3.5 py-2.5 border border-slate-200 dark:border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-slate-50 dark:bg-slate-700 text-xs sm:text-sm">
      </div>
      <div>
        <label class="block text-xs sm:text-sm font-semibold text-slate-600 dark:text-slate-400 mb-1">비밀번호</label>
        <input type="password" id="regPassword" placeholder="비밀번호 설정" required
               class="w-full px-3.5 py-2.5 border border-slate-200 dark:border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-slate-50 dark:bg-slate-700 text-xs sm:text-sm">
      </div>
      <div>
        <label class="block text-xs sm:text-sm font-semibold text-slate-600 dark:text-slate-400 mb-1">비밀번호 확인</label>
        <input type="password" id="regPasswordConfirm" placeholder="비밀번호 재입력" required
               class="w-full px-3.5 py-2.5 border border-slate-200 dark:border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-slate-50 dark:bg-slate-700 text-xs sm:text-sm">
      </div>
      <button type="submit" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-lg transition text-xs sm:text-sm shadow-xs touch-target">
        가입하기
      </button>
    </form>
  </div>

  <!-- 관리자 전용 화면 -->
  <div id="adminScreen" class="hidden max-w-2xl mx-auto bg-white dark:bg-slate-800 rounded-xl shadow-md p-5 border border-slate-200 dark:border-slate-700 mt-5">
    <div class="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-slate-700 mb-4">
      <h2 class="text-lg sm:text-xl font-bold text-slate-800 dark:text-slate-100">계정 관리자 모드</h2>
      <button onclick="closeAdminScreen()" class="text-xs sm:text-sm bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 text-slate-600 dark:text-slate-300 px-3 py-1.5 rounded-md font-semibold transition">
        ✕ 나가기
      </button>
    </div>

    <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mb-3">등록된 회원들의 아이디 및 비밀번호를 수정하거나 삭제할 수 있습니다.</p>

    <div class="overflow-x-auto">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="bg-slate-50 dark:bg-slate-700/50 text-xs sm:text-sm text-slate-500 dark:text-slate-400 border-b border-slate-200 dark:border-slate-700">
            <th class="p-2">아이디</th>
            <th class="p-2">비밀번호</th>
            <th class="p-2 text-right">관리</th>
          </tr>
        </thead>
        <tbody id="adminUserList" class="text-xs sm:text-base divide-y divide-slate-100 dark:divide-slate-700">
          <!-- 관리자 목록 렌더링 -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- 2. 메인 서비스 화면 -->
  <div id="mainScreen" class="hidden max-w-2xl mx-auto bg-white dark:bg-slate-800 rounded-xl shadow-md p-4 sm:p-6 border border-slate-200/80 dark:border-slate-700/80">
    <!-- 헤더 영역 -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between pb-3 border-b border-slate-100 dark:border-slate-700 mb-4 gap-3">
      <div>
        <div class="flex items-center gap-2">
          <h1 class="text-lg sm:text-2xl font-bold text-indigo-600 dark:text-indigo-400"><span id="displayName"></span>님의 할 일</h1>
          <button onclick="handleLogout()" class="text-xs sm:text-sm text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 underline">로그아웃</button>
        </div>
        <p id="clock" class="text-xs sm:text-sm font-medium text-slate-500 dark:text-slate-400 mt-1"></p>
      </div>

      <div class="flex items-center gap-2 self-start sm:self-auto flex-wrap">
        <button id="darkModeBtn" onclick="toggleDarkMode()" class="text-xs sm:text-sm bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 text-slate-700 dark:text-slate-200 px-2.5 py-1 rounded font-medium transition">
          🌙 야간
        </button>
        <button onclick="exportData()" class="text-xs sm:text-sm bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 text-slate-700 dark:text-slate-200 px-2.5 py-1 rounded font-medium transition">백업</button>
        <label class="text-xs sm:text-sm bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 text-slate-700 dark:text-slate-200 px-2.5 py-1 rounded font-medium transition cursor-pointer">
          복원 <input type="file" accept=".json" onchange="importData(event)" class="hidden">
        </label>
        <button id="notifyBtn" onclick="handleNotificationClick()" class="text-xs sm:text-sm px-2.5 py-1 rounded-full font-medium transition flex items-center gap-1 shadow-2xs">
          알림 확인 중...
        </button>
      </div>
    </div>

    <!-- 통합 스마트 입력 폼 (PC/대화면 전용) -->
    <div id="pcAddTodoContainer" class="hidden sm:block mb-4 bg-slate-50 dark:bg-slate-900/60 p-3.5 rounded-lg border border-slate-200 dark:border-slate-700">
      <div id="pcQuickChipsContainer" class="flex items-center gap-1.5 mb-2 text-xs sm:text-sm overflow-x-auto pb-1">
        <span class="text-xs sm:text-sm font-semibold text-slate-500 dark:text-slate-400 flex-shrink-0">빠른 마감:</span>
        <button type="button" id="btnPc_today11" onclick="setQuickTime('today11', 'pc')" class="quick-chip-pc px-2.5 py-1 rounded-full font-medium text-xs sm:text-sm flex-shrink-0 transition border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-100">오늘 11시</button>
        <button type="button" id="btnPc_today17" onclick="setQuickTime('today17', 'pc')" class="quick-chip-pc px-2.5 py-1 rounded-full font-medium text-xs sm:text-sm flex-shrink-0 transition border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-100">오늘 17시</button>
        <button type="button" id="btnPc_tomorrow11" onclick="setQuickTime('tomorrow11', 'pc')" class="quick-chip-pc px-2.5 py-1 rounded-full font-medium text-xs sm:text-sm flex-shrink-0 transition border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-100">내일 11시</button>
        <button type="button" id="btnPc_tomorrow17" onclick="setQuickTime('tomorrow17', 'pc')" class="quick-chip-pc px-2.5 py-1 rounded-full font-medium text-xs sm:text-sm flex-shrink-0 transition border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-100">내일 17시</button>
        <button type="button" id="btnPc_1h" onclick="setQuickTime('1h', 'pc')" class="quick-chip-pc px-2.5 py-1 rounded-full font-medium text-xs sm:text-sm flex-shrink-0 transition border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-100">+1시간</button>
      </div>

      <form id="todoFormPc" onsubmit="addUnifiedItem(event, 'pc')" class="space-y-2">
        <input type="text" id="taskInputPc" placeholder="할 일 또는 반복 루틴 입력 (예: '내일 오후 3시 보고서')..." required oninput="handleNaturalLanguageInput('pc')"
               class="w-full px-3.5 py-2 border border-slate-200 dark:border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white dark:bg-slate-800 text-xs sm:text-base">
        
        <div class="flex flex-wrap gap-2 items-center">
          <!-- 카테고리 / 루틴 선택 -->
          <select id="categoryInputPc" onchange="handleCategoryChange(this.value, 'pc')" class="px-3 py-1.5 border border-slate-200 dark:border-slate-700 rounded-lg text-xs sm:text-base focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white dark:bg-slate-800 font-bold text-indigo-600 dark:text-indigo-400">
            <option value="업무">업무</option>
            <option value="개인">개인</option>
            <option value="기타">기타</option>
            <option value="routine">🔄 루틴 (반복)</option>
          </select>

          <!-- 일반 마감 일시 -->
          <input type="datetime-local" id="timeInputPc" step="600"
                 class="flex-1 min-w-[170px] px-3 py-1.5 border border-slate-200 dark:border-slate-700 rounded-lg text-xs sm:text-base focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white dark:bg-slate-800">

          <!-- 루틴 동적 옵션 영역 (기본 숨김) -->
          <div id="pcRoutineOptions" class="hidden flex items-center gap-2">
            <select id="pcRoutineFreq" onchange="handleRoutineFreqChange(this.value, 'pc')" class="px-2.5 py-1.5 text-xs sm:text-base border border-slate-200 dark:border-slate-700 rounded-lg bg-white dark:bg-slate-800 font-medium">
              <option value="매일">매일</option>
              <option value="매주">매주</option>
              <option value="매월">매월</option>
            </select>
            <select id="pcRoutineDay" class="hidden px-2.5 py-1.5 text-xs sm:text-base border border-slate-200 dark:border-slate-700 rounded-lg bg-white dark:bg-slate-800">
              <option value="all">전체 요일(선택 안함)</option>
              <option value="1">월요일</option>
              <option value="2">화요일</option>
              <option value="3">수요일</option>
              <option value="4">목요일</option>
              <option value="5">금요일</option>
              <option value="6">토요일</option>
              <option value="0">일요일</option>
            </select>
            <select id="pcRoutineMonth" class="hidden px-2.5 py-1.5 text-xs sm:text-base border border-slate-200 dark:border-slate-700 rounded-lg bg-white dark:bg-slate-800">
              <!-- 1일 ~ 31일 -->
            </select>
            <span class="text-xs sm:text-sm text-slate-400">마감:</span>
            <input type="time" id="pcRoutineTime" step="600" class="px-2.5 py-1.5 text-xs sm:text-base border border-slate-200 dark:border-slate-700 rounded-lg bg-white dark:bg-slate-800">
          </div>

          <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-4 py-1.5 rounded-lg transition text-xs sm:text-base shadow-2xs">등록</button>
        </div>
      </form>
    </div>

    <!-- 탭 메뉴 (All / Today / Routine) & 컨트롤 바 -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between border-b border-slate-200 dark:border-slate-700 mb-3 gap-2">
      <div class="flex flex-1">
        <button id="tabAll" onclick="switchTab('all')" class="flex-1 sm:flex-initial sm:px-5 py-1.5 text-center font-bold text-indigo-600 border-b-2 border-indigo-600 transition text-xs sm:text-base">All</button>
        <button id="tabToday" onclick="switchTab('today')" class="flex-1 sm:flex-initial sm:px-5 py-1.5 text-center font-bold text-slate-400 border-b-2 border-transparent hover:text-slate-600 transition text-xs sm:text-base">Today</button>
        <button id="tabRoutine" onclick="switchTab('routine')" class="flex-1 sm:flex-initial sm:px-5 py-1.5 text-center font-bold text-slate-400 border-b-2 border-transparent hover:text-slate-600 transition text-xs sm:text-base">Routine 🔄</button>
      </div>

      <div class="flex items-center justify-between sm:justify-end gap-2 pb-1.5 sm:pb-0">
        <button id="hideCompletedBtn" onclick="toggleHideCompleted()" class="text-xs sm:text-sm text-slate-600 dark:text-slate-300 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 px-2.5 py-1 rounded font-medium transition">
          완료 숨기기
        </button>

        <div id="sortContainer" class="flex items-center gap-1.5">
          <span class="text-xs sm:text-sm text-slate-400">정렬:</span>
          <select id="sortInput" onchange="changeSortOrder(this.value)" class="text-xs sm:text-sm bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded px-2 py-1 text-slate-600 dark:text-slate-200 font-medium focus:outline-none">
            <option value="createdAt">최신순</option>
            <option value="dueDate">마감순</option>
          </select>
        </div>
      </div>
    </div>

    <!-- 할 일 / 루틴 목록 렌더링 영역 -->
    <div id="todoContainer">
      <ul id="todoList" class="space-y-2"></ul>
    </div>
  </div>

  <!-- 모바일 전용 통합 하단 고정 바 -->
  <div id="mobileAddTodoContainer" class="block sm:hidden fixed bottom-0 left-0 right-0 bg-white dark:bg-slate-800 border-t border-slate-200 dark:border-slate-700 shadow-2xl p-2.5 z-40">
    <form id="todoFormMobile" onsubmit="addUnifiedItem(event, 'mobile')" class="space-y-2">
      <!-- 접힘/펼침 세부 옵션 -->
      <div id="mobileMoreOptions" class="hidden space-y-2 pt-1 border-b border-slate-100 dark:border-slate-700 pb-2">
        <div id="mobileQuickChipsContainer" class="flex items-center gap-1 overflow-x-auto pb-1 text-xs">
          <span class="text-slate-400 flex-shrink-0 font-medium">빠른 마감:</span>
          <button type="button" id="btnMobile_today11" onclick="setQuickTime('today11', 'mobile')" class="quick-chip-mobile px-2 py-1 rounded-full font-medium text-xs flex-shrink-0 transition border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-700 text-slate-600 dark:text-slate-300">오늘 11시</button>
          <button type="button" id="btnMobile_today17" onclick="setQuickTime('today17', 'mobile')" class="quick-chip-mobile px-2 py-1 rounded-full font-medium text-xs flex-shrink-0 transition border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-700 text-slate-600 dark:text-slate-300">오늘 17시</button>
          <button type="button" id="btnMobile_tomorrow11" onclick="setQuickTime('tomorrow11', 'mobile')" class="quick-chip-mobile px-2 py-1 rounded-full font-medium text-xs flex-shrink-0 transition border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-700 text-slate-600 dark:text-slate-300">내일 11시</button>
          <button type="button" id="btnMobile_tomorrow17" onclick="setQuickTime('tomorrow17', 'mobile')" class="quick-chip-mobile px-2 py-1 rounded-full font-medium text-xs flex-shrink-0 transition border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-700 text-slate-600 dark:text-slate-300">내일 17시</button>
          <button type="button" id="btnMobile_1h" onclick="setQuickTime('1h', 'mobile')" class="quick-chip-mobile px-2 py-1 rounded-full font-medium text-xs flex-shrink-0 transition border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-700 text-slate-600 dark:text-slate-300">+1시간</button>
        </div>

        <div class="flex flex-wrap items-center gap-1.5">
          <select id="categoryInputMobile" onchange="handleCategoryChange(this.value, 'mobile')" class="px-2 py-1.5 border border-slate-200 dark:border-slate-700 rounded text-xs bg-slate-50 dark:bg-slate-700 font-bold text-indigo-600 dark:text-indigo-400">
            <option value="업무">업무</option>
            <option value="개인">개인</option>
            <option value="기타">기타</option>
            <option value="routine">🔄 루틴 (반복)</option>
          </select>

          <input type="datetime-local" id="timeInputMobile" step="600" class="flex-1 px-2.5 py-1.5 border border-slate-200 dark:border-slate-700 rounded text-xs bg-slate-50 dark:bg-slate-700">

          <div id="mobileRoutineOptions" class="hidden flex items-center gap-1.5 flex-1">

        <button type="button" onclick="toggleMobileOptions()" class="p-2 text-slate-400 hover:text-slate-600 text-xs font-semibold rounded border border-slate-200 dark:border-slate-700">

        <button type="submit" class="bg-indigo-600 text-white font-semibold px-3.5 py-2 rounded-lg text-xs sm:text-sm shadow-2xs touch-target flex-shrink-0">

  <script>
    let currentUser = localStorage.getItem('sunhong_todo_user') || '';
    let savedAccounts = JSON.parse(localStorage.getItem('sunhong_todo_accounts') || '[]');
    let localUsers = JSON.parse(localStorage.getItem('sunhong_todo_user_db') || '{}');
    let todos = [];
    let routines = [];
    let currentTab = 'all';
    let currentSort = 'createdAt';
    let hideCompleted = false;
    let swRegistration = null;

    /* 다크모드 초기화 */
    if (localStorage.getItem('sunhong_theme') === 'dark' || (!('sunhong_theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }

    function toggleDarkMode() {
      if (document.documentElement.classList.contains('dark')) {
        document.documentElement.classList.remove('dark');
        localStorage.setItem('sunhong_theme', 'light');
      } else {
        document.documentElement.classList.add('dark');
        localStorage.setItem('sunhong_theme', 'dark');
      }
      updateDarkModeBtnUI();
    }

    function updateDarkModeBtnUI() {
      const btn = document.getElementById('darkModeBtn');
      if (!btn) return;
      if (document.documentElement.classList.contains('dark')) {
        btn.innerHTML = "☀️ 주간";
      } else {
        btn.innerHTML = "🌙 야간";
      }
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').then(reg => { 
        swRegistration = reg;
        updateNotificationUI();
      }).catch(err => console.log('SW 등록 실패:', err));
    }

    window.addEventListener('firebase-ready', () => {
      if (currentUser) {
        setupFirebaseListener();
      }
    });

    /* 💡 강력하고 유연한 정규식 기반 스마트 자연어 파서 */
    function handleNaturalLanguageInput(mode) {
      const categoryVal = mode === 'pc' ? document.getElementById('categoryInputPc').value : document.getElementById('categoryInputMobile').value;
      if (categoryVal === 'routine') return;

      const inputId = mode === 'pc' ? 'taskInputPc' : 'taskInputMobile';
      const inputElem = document.getElementById(inputId);
      if (!inputElem) return;

      const text = inputElem.value;
      const now = new Date();
      let targetDate = new Date();
      let matched = false;

      // 1. 날짜 파싱 (오늘, 내일, 모레)
      if (text.includes('모레')) {
        targetDate.setDate(now.getDate() + 2);
        matched = true;
      } else if (text.includes('내일')) {
        targetDate.setDate(now.getDate() + 1);
        matched = true;
      } else if (text.includes('오늘')) {
        matched = true;
      }

      // 2. 상대 시간 파싱 (예: "3시간 뒤", "2시간후")
      const relativeHourMatch = text.match(/(\d+)\s*시간\s*(뒤|후)/);
      if (relativeHourMatch) {
        const hoursToAdd = parseInt(relativeHourMatch[1], 10);
        targetDate = new Date(now.getTime() + hoursToAdd * 60 * 60 * 1000);
        matched = true;
      } else {
        // 3. 시/분 파싱 (오전/오후 처리 포함)
        const isPm = text.includes('오후') || text.includes('저녁') || text.includes('밤');
        const isAm = text.includes('오전') || text.includes('아침');

        // 숫자 시간 추출 (예: "3시", "15시", "3시반", "3시 30분")
        const timeMatch = text.match(/(\d{1,2})\s*시(?:\s*(\d{1,2})\s*분?)?/);
        if (timeMatch) {
          let hours = parseInt(timeMatch[1], 10);
          const minutes = timeMatch[2] ? parseInt(timeMatch[2], 10) : 0;

          if (isPm && hours < 12) {
            hours += 12;
          } else if (isAm && hours === 12) {
            hours = 0;
          } else if (!isAm && !isPm && hours < 8 && hours !== 0) {
            hours += 12;
          }

          targetDate.setHours(hours, minutes, 0, 0);
          matched = true;
        }
      }

      if (matched) {
        const year = targetDate.getFullYear();
        const month = String(targetDate.getMonth() + 1).padStart(2, '0');
        const day = String(targetDate.getDate()).padStart(2, '0');
        const hours = String(targetDate.getHours()).padStart(2, '0');
        const minutes = String(targetDate.getMinutes()).padStart(2, '0');

        const timeStr = `${year}-${month}-${day}T${hours}:${minutes}`;
        if (mode === 'pc') document.getElementById('timeInputPc').value = timeStr;
        else document.getElementById('timeInputMobile').value = timeStr;
      }
    }

    function toggleMobileOptions(show) {
      const opts = document.getElementById('mobileMoreOptions');
      if (!opts) return;
      if (show === true) opts.classList.remove('hidden');
      else if (show === false) opts.classList.add('hidden');
      else opts.classList.toggle('hidden');
    }

    function toggleSubTooltip(event, elemId) {
      event.stopPropagation();
      const allTooltips = document.querySelectorAll('.has-tooltip');
      allTooltips.forEach(el => {
        if (el.id !== elemId) el.classList.remove('active-tooltip');
      });
      const target = document.getElementById(elemId);
      if (target) {
        target.classList.toggle('active-tooltip');
        setTimeout(() => target.classList.remove('active-tooltip'), 3000);
      }
    }

    document.addEventListener('click', () => {
      document.querySelectorAll('.has-tooltip').forEach(el => el.classList.remove('active-tooltip'));
    });

    function switchAuthTab(tab) {
      const tabLogin = document.getElementById('tabLogin');
      const tabRegister = document.getElementById('tabRegister');
      const loginForm = document.getElementById('loginForm');
      const registerForm = document.getElementById('registerForm');

      if (tab === 'login') {
        tabLogin.className = "flex-1 py-2 text-center font-semibold text-indigo-600 dark:text-indigo-400 border-b-2 border-indigo-600 dark:border-indigo-400 text-xs sm:text-base";
        tabRegister.className = "flex-1 py-2 text-center font-semibold text-slate-400 border-b-2 border-transparent hover:text-slate-600 text-xs sm:text-base";
        loginForm.classList.remove('hidden');
        registerForm.classList.add('hidden');
      } else {
        tabRegister.className = "flex-1 py-2 text-center font-semibold text-indigo-600 dark:text-indigo-400 border-b-2 border-indigo-600 dark:border-indigo-400 text-xs sm:text-base";
        tabLogin.className = "flex-1 py-2 text-center font-semibold text-slate-400 border-b-2 border-transparent hover:text-slate-600 text-xs sm:text-base";
        registerForm.classList.remove('hidden');
        loginForm.classList.add('hidden');
      }
    }

    async function handleRegisterSubmit(e) {
      e.preventDefault();
      const username = document.getElementById('regUsername').value.trim();
      const password = document.getElementById('regPassword').value;
      const confirmPassword = document.getElementById('regPasswordConfirm').value;

      if (!username || !password) return;
      if (password !== confirmPassword) {
        alert('비밀번호가 일치하지 않습니다.');
        return;
      }

      try {
        if (window.firebaseDb) {
          const userRef = window.dbRef(window.firebaseDb, `users/${username}`);
          const snapshot = await window.dbGet(userRef);

          if (snapshot.exists()) {
            alert('이미 존재하는 아이디입니다.');
            return;
          }
          await window.dbSet(userRef, { password: password, createdAt: Date.now() });
        } else {
          if (localUsers[username]) {
            alert('이미 존재하는 아이디입니다.');
            return;
          }
          localUsers[username] = password;
          localStorage.setItem('sunhong_todo_user_db', JSON.stringify(localUsers));
        }

        if (!savedAccounts.includes(username)) {
          savedAccounts.push(username);
          localStorage.setItem('sunhong_todo_accounts', JSON.stringify(savedAccounts));
        }

        alert('가입이 완료되었습니다! 로그인해 주세요.');
        document.getElementById('regUsername').value = '';
        document.getElementById('regPassword').value = '';
        document.getElementById('regPasswordConfirm').value = '';

        switchAuthTab('login');
        fillUsername(username);
      } catch (err) {
        alert('회원가입 처리 중 오류가 발생했습니다: ' + err.message);
      }
    }

    async function handleLoginSubmit(e) {
      e.preventDefault();
      const username = document.getElementById('loginUsername').value.trim();
      const password = document.getElementById('loginPassword').value;

      if (!username || !password) return;

      try {
        let isSuccess = false;

        if (window.firebaseDb) {
          const userRef = window.dbRef(window.firebaseDb, `users/${username}`);
          const snapshot = await window.dbGet(userRef);

          if (!snapshot.exists()) {
            alert('존재하지 않는 아이디입니다.');
            return;
          }
          const userData = snapshot.val();
          if (userData.password === password) {
            isSuccess = true;
          }
        } else {
          if (localUsers[username] && localUsers[username] === password) {
            isSuccess = true;
          }
        }

        if (!isSuccess) {
          alert('비밀번호가 올바르지 않습니다.');
          return;
        }

        if (!savedAccounts.includes(username)) {
          savedAccounts.push(username);
          localStorage.setItem('sunhong_todo_accounts', JSON.stringify(savedAccounts));
        }

        currentUser = username;
        localStorage.setItem('sunhong_todo_user', currentUser);
        initApp();
      } catch (err) {
        alert('로그인 시도 중 오류가 발생했습니다: ' + err.message);
      }
    }

    function fillUsername(username) {
      document.getElementById('loginUsername').value = username;
      document.getElementById('loginPassword').focus();
    }

    function openAdminPrompt() {
      const input = prompt("관리자 비밀번호를 입력하세요:");
      if (input === "전선홍관리자") {
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('adminScreen').classList.remove('hidden');
        loadAdminUserList();
      } else if (input !== null) {
        alert("비밀번호가 올바르지 않습니다.");
      }
    }

    function closeAdminScreen() {
      document.getElementById('adminScreen').classList.add('hidden');
      document.getElementById('loginScreen').classList.remove('hidden');
    }

    async function loadAdminUserList() {
      const listElem = document.getElementById('adminUserList');
      listElem.innerHTML = '<tr><td colspan="3" class="p-2 text-center text-slate-400">목록을 불러오는 중...</td></tr>';

      let userMap = {};

      if (window.firebaseDb) {
        const usersRef = window.dbRef(window.firebaseDb, 'users');
        const snapshot = await window.dbGet(usersRef);
        if (snapshot.exists()) {
          const data = snapshot.val();
          Object.keys(data).forEach(uname => {
            userMap[uname] = data[uname].password || '***';
          });
        }
      } else {
        userMap = localUsers;
      }

      const keys = Object.keys(userMap);
      if (keys.length === 0) {
        listElem.innerHTML = '<tr><td colspan="3" class="p-2 text-center text-slate-400">가입된 회원이 없습니다.</td></tr>';
        return;
      }

      listElem.innerHTML = keys.map(uname => `
        <tr>
          <td class="p-2 font-semibold text-slate-800 dark:text-slate-100">${uname}</td>
          <td class="p-2 font-mono text-xs sm:text-sm text-indigo-600 dark:text-indigo-400">${userMap[uname]}</td>
          <td class="p-2 text-right space-x-1.5">
            <button onclick="adminEditUser('${uname}', '${userMap[uname]}')" class="text-xs sm:text-sm bg-indigo-50 dark:bg-indigo-950 text-indigo-600 dark:text-indigo-300 px-2.5 py-1 rounded">수정</button>
            <button onclick="adminDeleteUser('${uname}')" class="text-xs sm:text-sm bg-rose-50 dark:bg-rose-950 text-rose-600 dark:text-rose-300 px-2.5 py-1 rounded">삭제</button>
          </td>
        </tr>
      `).join('');
    }

    async function adminEditUser(uname, oldPass) {
      const newPass = prompt(`[${uname}] 회원의 새 비밀번호를 입력하세요:`, oldPass);
      if (!newPass || newPass === oldPass) return;

      if (window.firebaseDb) {
        const userRef = window.dbRef(window.firebaseDb, `users/${uname}`);
        await window.dbSet(userRef, { password: newPass, updatedAt: Date.now() });
      } else {
        localUsers[uname] = newPass;
        localStorage.setItem('sunhong_todo_user_db', JSON.stringify(localUsers));
      }

      alert(`[${uname}] 회원의 비밀번호가 변경되었습니다.`);
      loadAdminUserList();
    }

    async function adminDeleteUser(uname) {
      if (!confirm(`정말로 [${uname}] 계정을 삭제하시겠습니까? 데이터는 복구되지 않습니다.`)) return;

      if (window.firebaseDb) {
        const userRef = window.dbRef(window.firebaseDb, `users/${uname}`);
        const userTodosRef = window.dbRef(window.firebaseDb, `todos/${uname}`);
        const userRoutinesRef = window.dbRef(window.firebaseDb, `routines/${uname}`);
        await window.dbRemove(userRef);
        await window.dbRemove(userTodosRef);
        await window.dbRemove(userRoutinesRef);
      } else {
        delete localUsers[uname];
        localStorage.setItem('sunhong_todo_user_db', JSON.stringify(localUsers));
      }

      savedAccounts = savedAccounts.filter(a => a !== uname);
      localStorage.setItem('sunhong_todo_accounts', JSON.stringify(savedAccounts));

      alert(`[${uname}] 계정이 삭제되었습니다.`);
      loadAdminUserList();
    }

    function addToGoogleCalendar(taskTitle, category, dueString) {
      let startDateStr, endDateStr;

      if (dueString && dueString.includes('T')) {
        const start = new Date(dueString);
        const end = new Date(start.getTime() + 30 * 60 * 1000);
        
        startDateStr = start.toISOString().replace(/-|:|\.\d\d\d/g, "");
        endDateStr = end.toISOString().replace(/-|:|\.\d\d\d/g, "");
      } else {
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        const dateFormatted = `${year}${month}${day}`;
        startDateStr = dateFormatted;
        endDateStr = dateFormatted;
      }

      const titleParam = encodeURIComponent(`[${category || '할일'}] ${taskTitle}`);
      const detailsParam = encodeURIComponent(`할 일 웹 앱에서 추가된 일정입니다.`);
      
      const gcalUrl = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${titleParam}&dates=${startDateStr}/${endDateStr}&details=${detailsParam}`;
      window.open(gcalUrl, '_blank');
    }

    function updateNotificationUI() {
      const btn = document.getElementById('notifyBtn');
      if (!btn) return;

      if (!('Notification' in window)) {
        btn.className = "text-xs sm:text-sm px-2.5 py-1 rounded-full font-medium bg-slate-100 text-slate-400";
        btn.innerText = "알림 미지원";
        return;
      }

      if (Notification.permission === 'granted') {
        btn.className = "text-xs sm:text-sm px-2.5 py-1 rounded-full font-medium bg-emerald-50 dark:bg-emerald-950 text-emerald-600 dark:text-emerald-400 border border-emerald-200 dark:border-emerald-800";
        btn.innerText = "알림 켜짐";
      } else if (Notification.permission === 'denied') {
        btn.className = "text-xs sm:text-sm px-2.5 py-1 rounded-full font-medium bg-rose-50 dark:bg-rose-950 text-rose-600 dark:text-rose-400 border border-rose-200 dark:border-rose-800";
        btn.innerText = "알림 차단됨";
      } else {
        btn.className = "text-xs sm:text-sm px-2.5 py-1 rounded-full font-medium bg-amber-50 dark:bg-amber-950 text-amber-600 dark:text-amber-400 border border-amber-200 dark:border-amber-800 animate-pulse";
        btn.innerText = "알림 설정 필요";
      }
    }

    function handleNotificationClick() {
      if (!('Notification' in window)) {
        alert('이 브라우저는 웹 알림을 지원하지 않습니다.');
        return;
      }

      if (Notification.permission === 'granted') {
        triggerNotification("알림 테스트", "선홍님의 푸시 알림이 정상적으로 작동하고 있습니다!");
      } else if (Notification.permission === 'denied') {
        alert('브라우저 설정에서 알림 권한을 [허용]으로 변경해 주셔야 합니다.');
      } else {
        Notification.requestPermission().then(permission => {
          updateNotificationUI();
          if (permission === 'granted') {
            triggerNotification("알림 활성화 완료", "이제 마감 10분 전 및 마감 정시에 알림이 발송됩니다.");
          }
        });
      }
    }

    function triggerNotification(title, body) {
      if (Notification.permission !== 'granted') return;

      if (navigator.serviceWorker && navigator.serviceWorker.controller) {
        navigator.serviceWorker.controller.postMessage({
          type: 'SHOW_NOTIFICATION',
          title: title,
          body: body
        });
      } else if (swRegistration && swRegistration.showNotification) {
        swRegistration.showNotification(title, {
          body: body,
          icon: 'https://cdn-icons-png.flaticon.com/512/906/906334.png'
        });
      } else {
        new Notification(title, { body: body });
      }
    }

    function checkDueNotifications() {
      if (Notification.permission !== 'granted' || !todos.length) return;

      const now = new Date();
      let updated = false;

      todos.forEach(t => {
        if (!t.completed && t.due) {
          const dueTime = new Date(t.due);
          const diffMinutes = (dueTime - now) / (1000 * 60);

          if (diffMinutes > 0 && diffMinutes <= 10 && !t.notified10m) {
            triggerNotification("마감 10분 전!", `[${t.category}] ${t.task} 마감 10분 전입니다.`);
            t.notified10m = true;
            updated = true;
          }

          if (now >= dueTime && (now - dueTime) < 10 * 60 * 1000 && !t.notified) {
            triggerNotification("마감 시간이 되었습니다!", `[${t.category}] ${t.task} 마감 시각이 되었습니다.`);
            t.notified = true;
            t.notified10m = true;
            updated = true;
          }
        }

        if (t.subitems && t.subitems.length > 0) {
          t.subitems.forEach(s => {
            if (!s.completed && s.due) {
              const subDueTime = new Date(s.due);
              const subDiffMinutes = (subDueTime - now) / (1000 * 60);

              if (subDiffMinutes > 0 && subDiffMinutes <= 10 && !s.notified10m) {
                triggerNotification("하위 할 일 10분 전!", `[하위] ${s.task} 마감 10분 전입니다.`);
                s.notified10m = true;
                updated = true;
              }

              if (now >= subDueTime && (now - subDueTime) < 10 * 60 * 1000 && !s.notified) {
                triggerNotification("하위 할 일 마감!", `[하위] ${s.task} 마감 시각이 되었습니다.`);
                s.notified = true;
                s.notified10m = true;
                updated = true;
              }
            }
          });
        }
      });

      if (updated) {
        saveAndRender();
      }
    }
    setInterval(checkDueNotifications, 3000);

    function getTodayString() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function getOneHourLaterString() {
      const now = new Date();
      now.setHours(now.getHours() + 1);
      const mins = Math.ceil(now.getMinutes() / 10) * 10;
      now.setMinutes(mins);
      now.setSeconds(0);

      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');

      return `${year}-${month}-${day}T${hours}:${minutes}`;
    }

    function setDefaultTimeInputs() {
      const defaultTime = getOneHourLaterString();
      if (document.getElementById('timeInputPc')) document.getElementById('timeInputPc').value = defaultTime;
      if (document.getElementById('timeInputMobile')) document.getElementById('timeInputMobile').value = defaultTime;
      
      updateChipHighlight('1h', 'pc');
      updateChipHighlight('1h', 'mobile');
    }

    function setQuickTime(type, mode = 'pc', targetElementId = null) {
      const now = new Date();
      let targetDate = new Date();
      let chipKey = '';

      if (type === 'today11') {
        targetDate.setHours(11, 0, 0, 0);
        chipKey = 'today11';
      } else if (type === 'today17') {
        targetDate.setHours(17, 0, 0, 0);
        chipKey = 'today17';
      } else if (type === 'tomorrow11') {
        targetDate.setDate(now.getDate() + 1);
        targetDate.setHours(11, 0, 0, 0);
        chipKey = 'tomorrow11';
      } else if (type === 'tomorrow17') {
        targetDate.setDate(now.getDate() + 1);
        targetDate.setHours(17, 0, 0, 0);
        chipKey = 'tomorrow17';
      } else if (type === 1 || type === '1h') {
        targetDate.setHours(now.getHours() + 1);
        const mins = Math.ceil(now.getMinutes() / 10) * 10;
        targetDate.setMinutes(mins);
        targetDate.setSeconds(0);
        chipKey = '1h';
      }

      const year = targetDate.getFullYear();
      const month = String(targetDate.getMonth() + 1).padStart(2, '0');
      const day = String(targetDate.getDate()).padStart(2, '0');
      const hours = String(targetDate.getHours()).padStart(2, '0');
      const minutes = String(targetDate.getMinutes()).padStart(2, '0');

      const timeStr = `${year}-${month}-${day}T${hours}:${minutes}`;

      if (targetElementId) {
        const inputElem = document.getElementById(targetElementId);
        if (inputElem) inputElem.value = timeStr;
      } else if (mode === 'pc') {
        const inputPc = document.getElementById('timeInputPc');
        if (inputPc) inputPc.value = timeStr;
        updateChipHighlight(chipKey, mode);
      } else {
        const inputMobile = document.getElementById('timeInputMobile');
        if (inputMobile) inputMobile.value = timeStr;
        updateChipHighlight(chipKey, mode);
      }
    }

    function updateChipHighlight(activeKey, mode) {
      const prefix = mode === 'pc' ? 'btnPc_' : 'btnMobile_';
      const classGroup = mode === 'pc' ? '.quick-chip-pc' : '.quick-chip-mobile';

      document.querySelectorAll(classGroup).forEach(btn => {
        btn.className = mode === 'pc' 
          ? "quick-chip-pc px-2.5 py-1 rounded-full font-medium text-xs sm:text-sm flex-shrink-0 transition border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-100"
          : "quick-chip-mobile px-2 py-1 rounded-full font-medium text-xs flex-shrink-0 transition border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-100";
      });

      const activeBtn = document.getElementById(prefix + activeKey);
      if (activeBtn) {
        activeBtn.className = mode === 'pc'
          ? "quick-chip-pc px-2.5 py-1 rounded-full font-bold text-xs sm:text-sm flex-shrink-0 transition bg-indigo-600 text-white shadow-2xs border border-indigo-600"
          : "quick-chip-mobile px-2 py-1 rounded-full font-bold text-xs flex-shrink-0 transition bg-indigo-600 text-white shadow-2xs border border-indigo-600";
      }
    }

    function updateClock() {
      const now = new Date();
      const days = ['일', '월', '화', '수', '목', '금', '토'];
      const dateStr = `${now.getFullYear()}년 ${now.getMonth() + 1}월 ${now.getDate()}일 (${days[now.getDay()]})`;
      const timeStr = now.toLocaleTimeString('ko-KR', { hour12: true, hour: '2-digit', minute: '2-digit', second: '2-digit' });
      const clockElem = document.getElementById('clock');
      if (clockElem) clockElem.innerText = `${dateStr} ${timeStr}`;

      if (currentTab === 'today' && now.getSeconds() === 0) {
        render();
      }

    /* --- Firebase 실시간 동기화 --- */
    function setupFirebaseListener() {
      if (!window.firebaseDb || !currentUser) return;
      
      const userTodosRef = window.dbRef(window.firebaseDb, `todos/${currentUser}`);
      window.dbOnValue(userTodosRef, (snapshot) => {
        const data = snapshot.val();
        todos = data ? (Array.isArray(data) ? data : Object.values(data)) : [];
        todos = todos.map(t => ({ ...t, subitems: t.subitems || [] }));
        localStorage.setItem(`sunhong_todos_${currentUser}`, JSON.stringify(todos));
        render();
      });

      const userRoutinesRef = window.dbRef(window.firebaseDb, `routines/${currentUser}`);
      window.dbOnValue(userRoutinesRef, (snapshot) => {
        const data = snapshot.val();
        routines = data ? (Array.isArray(data) ? data : Object.values(data)) : [];
        localStorage.setItem(`sunhong_routines_${currentUser}`, JSON.stringify(routines));
        render();
      });
    }

    function syncToFirebase() {
      if (!window.firebaseDb || !currentUser) return;
      window.dbSet(window.dbRef(window.firebaseDb, `todos/${currentUser}`), todos);
      window.dbSet(window.dbRef(window.firebaseDb, `routines/${currentUser}`), routines);
    }

    function saveAndRender() {
      if (currentUser) {
        localStorage.setItem(`sunhong_todos_${currentUser}`, JSON.stringify(todos));
        localStorage.setItem(`sunhong_routines_${currentUser}`, JSON.stringify(routines));
        syncToFirebase();
      }
      render();
    }

    function exportData() {
      if (!todos.length && !routines.length) { alert('백업할 데이터가 없습니다.'); return; }
      const payload = { todos, routines };
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(payload, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `todo_routine_backup_${currentUser}_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (Array.isArray(imported)) {
            todos = imported;
          } else if (imported.todos || imported.routines) {
            todos = imported.todos || [];
            routines = imported.routines || [];
          }
          saveAndRender();
          alert('데이터가 성공적으로 복원되었습니다.');
        } catch (err) {
          alert('파일을 읽는 중 오류가 발생했습니다.');
        }
      };
      reader.readAsText(file);
    }

    function getDDayTag(dateString) {
      if (!dateString) return '';
      const now = new Date();
      now.setHours(0,0,0,0);
      const target = new Date(dateString);
      const targetDay = new Date(dateString);
      targetDay.setHours(0,0,0,0);

      const diffDays = Math.ceil((targetDay - now) / (1000 * 60 * 60 * 24));

      if (new Date() > target && diffDays <= 0) {
        return `<span class="text-[10px] sm:text-xs font-bold bg-rose-100 text-rose-600 border border-rose-200 dark:bg-rose-950 dark:text-rose-300 dark:border-rose-800 px-1.5 py-0.5 rounded animate-pulse">기한 초과</span>`;
      } else if (diffDays === 0) {
        return `<span class="text-[10px] sm:text-xs font-bold bg-amber-100 text-amber-700 border border-amber-200 dark:bg-amber-950 dark:text-amber-300 dark:border-amber-800 px-1.5 py-0.5 rounded">D-Day</span>`;
      } else if (diffDays > 0) {
        return `<span class="text-[10px] sm:text-xs font-semibold bg-blue-50 text-blue-600 border border-blue-200 dark:bg-blue-950 dark:text-blue-300 dark:border-blue-800 px-1.5 py-0.5 rounded">D-${diffDays}</span>`;
      } else {
        return `<span class="text-[10px] sm:text-xs font-bold bg-rose-100 text-rose-600 border border-rose-200 dark:bg-rose-950 dark:text-rose-300 dark:border-rose-800 px-1.5 py-0.5 rounded">기한 초과</span>`;
      }
    }

    function addUnifiedItem(e, mode) {
      e.preventDefault();
      const task = mode === 'pc' ? document.getElementById('taskInputPc').value.trim() : document.getElementById('taskInputMobile').value.trim();
      const category = mode === 'pc' ? document.getElementById('categoryInputPc').value : document.getElementById('categoryInputMobile').value;

      if (!task) return;

      if (category === 'routine') {
        const freq = mode === 'pc' ? document.getElementById('pcRoutineFreq').value : document.getElementById('mobileRoutineFreq').value;
        const dueTime = mode === 'pc' ? document.getElementById('pcRoutineTime').value : document.getElementById('mobileRoutineTime').value;
        let dayVal = '';

        if (freq === '매주') {
          dayVal = mode === 'pc' ? document.getElementById('pcRoutineDay').value : document.getElementById('mobileRoutineDay').value;
        } else if (freq === '매월') {
          dayVal = mode === 'pc' ? document.getElementById('pcRoutineMonth').value : document.getElementById('mobileRoutineMonth').value;
        }

        routines.unshift({
          id: Date.now(),
          task: task,
          freq: freq,
          dayVal: dayVal,
          dueTime: dueTime,
          lastCompletedDate: null
        });

      } else {
        const due = mode === 'pc' ? document.getElementById('timeInputPc').value : document.getElementById('timeInputMobile').value;
        todos.unshift({ id: Date.now(), task, due, category, completed: false, isEditing: false, isAddingSub: false, notified: false, notified10m: false, subitems: [] });
      }

      if (mode === 'pc') {
        document.getElementById('taskInputPc').value = '';
      } else {
        document.getElementById('taskInputMobile').value = '';
        toggleMobileOptions(false);
      }

      setDefaultTimeInputs();
      saveAndRender();

      } else if (freqInput === '매월') {

    function isRoutineDueToday(routine) {
      const now = new Date();
      const currentDayOfWeek = now.getDay();
      const currentDayOfMonth = now.getDate();

      if (routine.freq === '매일') return true;

      if (routine.freq === '매주') {
        if (!routine.dayVal || routine.dayVal === 'all') return true;
        return parseInt(routine.dayVal, 10) === currentDayOfWeek;
      }

      if (routine.freq === '매월') {
        if (!routine.dayVal) return true;
        const targetDay = parseInt(routine.dayVal, 10);
        const lastDayOfCurrentMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();

        if (targetDay > lastDayOfCurrentMonth) {
          return currentDayOfMonth === lastDayOfCurrentMonth;
        }
        return currentDayOfMonth === targetDay;
      }

      return false;
    }

    function isToday(dateString) {
      if (!dateString) return false;
      const todayStr = getTodayString();
      return dateString.startsWith(todayStr);
    }

    function getEarliestDue(todo) {
      if (todo.due) return todo.due;
      if (todo.subitems && todo.subitems.length > 0) {
        const dues = todo.subitems.map(s => s.due).filter(Boolean).sort();
        if (dues.length > 0) return dues[0];
      }
      return '9999-99-99';
    }

    function renderTodayTimelineTab(container) {
      const currentHour = new Date().getHours();
      const todayStr = getTodayString();
      
      let todayItems = [];

      todos.forEach(t => {
        const hasSub = t.subitems && t.subitems.length > 0;

        if (!hasSub && isToday(t.due)) {
          if (!hideCompleted || !t.completed) {
            todayItems.push({ ...t, isSub: false, isRoutine: false, parentId: null, parentTask: null });
          }
        }

        if (hasSub) {
          t.subitems.forEach(s => {
            if (isToday(s.due)) {
              if (!hideCompleted || !s.completed) {
                todayItems.push({ ...s, isSub: true, isRoutine: false, parentId: t.id, parentTask: t.task, parentCategory: t.category });
              }
            }
          });
        }
      });

      routines.forEach(r => {
        if (isRoutineDueToday(r)) {
          const isDone = r.lastCompletedDate === todayStr;
          if (!hideCompleted || !isDone) {
            const fullDueStr = r.dueTime ? `${todayStr}T${r.dueTime}` : '';
            todayItems.push({
              id: r.id,
              task: r.task,
              due: fullDueStr,
              category: '루틴',
              completed: isDone,
              isSub: false,
              isRoutine: true,
              freq: r.freq
            });
          }
        }
      });

      const hourlyMap = {};
      for (let h = 0; h < 24; h++) hourlyMap[h] = [];
      const noTimeItems = [];

      todayItems.forEach(item => {
        if (!item.due || !item.due.includes('T')) {
          noTimeItems.push(item);
        } else {
          const hour = parseInt(item.due.split('T')[1].split(':')[0], 10);
          if (hourlyMap[hour]) hourlyMap[hour].push(item);
          else noTimeItems.push(item);
        }
      });

      if (todayItems.length === 0) {
        container.innerHTML = `
          <div class="text-center py-10 bg-slate-50 dark:bg-slate-800/80 border border-slate-200/80 dark:border-slate-700 rounded-xl">
            <p class="text-slate-400 text-xs sm:text-base">오늘 예정된 일정 및 루틴이 없습니다.</p>
          </div>
        `;
        return;
      }

      let html = `<div class="space-y-2">`;

      if (noTimeItems.length > 0) {
        html += `
          <div class="bg-indigo-50/50 dark:bg-indigo-950/30 border border-indigo-100 dark:border-indigo-900 rounded-xl p-3">
            <h3 class="text-xs sm:text-base font-bold text-indigo-700 dark:text-indigo-300 mb-1.5">오늘 시간 미지정</h3>
            <div class="space-y-1.5 pl-1">
              ${noTimeItems.map(item => renderTimelineItemHtml(item)).join('')}
            </div>
          </div>
        `;
      }

      for (let h = 0; h < 24; h++) {
        const items = hourlyMap[h];
        const isCurrentHour = h === currentHour;

        if (items.length > 0 || isCurrentHour) {
          const hourLabel = `${String(h).padStart(2, '0')}:00`;

          html += `
            <div class="flex items-start gap-2 p-2.5 rounded-xl border transition ${isCurrentHour ? 'bg-blue-50/60 dark:bg-blue-950/40 border-blue-300 dark:border-blue-700 ring-1 ring-blue-200 dark:ring-blue-800' : 'bg-slate-50/70 dark:bg-slate-800/60 border-slate-200/70 dark:border-slate-700/70'}">
              <div class="w-14 sm:w-16 text-xs sm:text-base font-bold ${isCurrentHour ? 'text-blue-600 dark:text-blue-400' : 'text-slate-500 dark:text-slate-400'} flex flex-col items-start pt-1">
                <span>${hourLabel}</span>
                ${isCurrentHour ? `<span class="text-[9px] sm:text-xs bg-blue-600 text-white px-1.5 py-0.5 rounded mt-0.5">LIVE</span>` : ''}
              </div>
              <div class="flex-1 min-h-[26px] space-y-1.5">
                ${items.length > 0 ? items.map(item => renderTimelineItemHtml(item)).join('') : `<span class="text-xs sm:text-sm text-slate-300 dark:text-slate-600 italic">현재 시각 (일정 없음)</span>`}
              </div>
            </div>
          `;
        }
      }

      html += `</div>`;
      container.innerHTML = html;
    }

    function renderTimelineItemHtml(item) {
      const dueTimeStr = item.due && item.due.includes('T') ? item.due.split('T')[1] : '';

      if (item.isRoutine) {
        return `
          <div class="flex items-center justify-between text-xs sm:text-base bg-emerald-50/60 dark:bg-emerald-950/30 p-2.5 rounded-lg border border-emerald-200 dark:border-emerald-800/60 shadow-2xs">
            <div class="flex items-center gap-2">
              <input type="checkbox" ${item.completed ? 'checked' : ''} onchange="toggleRoutineToday(${item.id})" class="w-4 h-4 sm:w-5 sm:h-5 accent-emerald-600 rounded cursor-pointer">
              <span class="${item.completed ? 'line-through text-slate-400' : 'text-slate-800 dark:text-slate-100 font-semibold'}">${item.task}</span>
              <span class="text-[10px] sm:text-xs bg-emerald-100 dark:bg-emerald-900 text-emerald-700 dark:text-emerald-300 px-1.5 py-0.5 rounded font-medium">🔄 ${item.freq}</span>
            </div>
            <div class="flex items-center gap-1">
              ${dueTimeStr ? `<span class="text-xs sm:text-sm font-bold text-emerald-600 dark:text-emerald-400">⏰ ${dueTimeStr}</span>` : ''}
            </div>
          </div>
        `;
      } else if (item.isSub) {
        const tooltipId = `tooltip_sub_${item.id}`;
        return `
          <div class="flex items-center justify-between text-xs sm:text-base bg-white dark:bg-slate-800 p-2.5 rounded-lg border border-slate-200 dark:border-slate-700 shadow-2xs">
            <div class="flex items-center gap-2">
              <input type="checkbox" ${item.completed ? 'checked' : ''} onchange="toggleSubitem(${item.parentId}, ${item.id})" class="w-4 h-4 sm:w-5 sm:h-5 accent-indigo-600 rounded cursor-pointer">
              <span class="${item.completed ? 'line-through text-slate-400' : 'text-slate-700 dark:text-slate-200 font-medium'}">${item.task}</span>
              
              <div id="${tooltipId}" class="relative inline-block has-tooltip cursor-pointer" onclick="toggleSubTooltip(event, '${tooltipId}')">
                <span class="text-[10px] sm:text-xs bg-indigo-50 dark:bg-indigo-950 text-indigo-600 dark:text-indigo-300 px-1.5 py-0.5 rounded font-semibold border border-indigo-100 dark:border-indigo-800">하위</span>
                <div class="tooltip-box bg-slate-800 dark:bg-slate-900 text-white text-xs px-2.5 py-1 rounded-lg shadow-lg border border-slate-700">
                  📂 그룹: ${item.parentTask || '상위 그룹'}
                </div>
              </div>
            </div>

            <div class="flex items-center gap-1">
              ${dueTimeStr ? `<span class="text-xs sm:text-sm font-semibold text-slate-500 dark:text-slate-400">⏰ ${dueTimeStr}</span>` : ''}
            </div>
          </div>
        `;
      } else {
        return `
          <div class="flex items-center justify-between text-xs sm:text-base bg-white dark:bg-slate-800 p-2.5 rounded-lg border border-slate-200 dark:border-slate-700 shadow-2xs">
            <div class="flex items-center gap-2">
              <input type="checkbox" ${item.completed ? 'checked' : ''} onchange="toggleComplete(${item.id})" class="w-4 h-4 sm:w-5 sm:h-5 accent-indigo-600 rounded cursor-pointer">
              <span class="${item.completed ? 'line-through text-slate-400' : 'text-slate-800 dark:text-slate-100 font-semibold'}">${item.task}</span>
              <span class="text-[10px] sm:text-xs bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 px-1.5 py-0.5 rounded font-medium">${item.category}</span>
            </div>
            <div class="flex items-center gap-1">
              ${dueTimeStr ? `<span class="text-xs sm:text-sm font-bold text-indigo-600 dark:text-indigo-400">⏰ ${dueTimeStr}</span>` : ''}
            </div>
          </div>
        `;
      }
    }

      const daysOfWeek = [
        { val: 'all', label: '전체' },
        { val: '1', label: '월' }, { val: '2', label: '화' }, { val: '3', label: '수' },
        { val: '4', label: '목' }, { val: '5', label: '금' }, { val: '6', label: '토' }, { val: '0', label: '일' }

      container.innerHTML = `
        <div class="space-y-2.5">

              <p class="text-slate-400 dark:text-slate-500 text-xs sm:text-sm mt-1.5">상단 입력창에서 카테고리를 <strong class="text-indigo-600 dark:text-indigo-400">[🔄 루틴]</strong>으로 선택하여 등록하세요.</p>

          ` : `
            <ul class="space-y-2">

                    ` : `
                      <div class="flex items-center justify-between">
                        <div class="flex items-center gap-2.5">
                          <input type="checkbox" ${isDoneToday ? 'checked' : ''} onchange="toggleRoutineToday(${r.id})" class="w-4 h-4 sm:w-5 sm:h-5 accent-emerald-600 rounded cursor-pointer">
                          <div>
                            <div class="flex items-center gap-2">
                              <span class="text-xs sm:text-base font-semibold ${isDoneToday ? 'line-through text-slate-400 dark:text-slate-500' : 'text-slate-800 dark:text-slate-100'}">${r.task}</span>
                              ${r.dueTime ? `<span class="text-xs sm:text-sm font-bold text-indigo-600 dark:text-indigo-400">⏰ ${r.dueTime}</span>` : ''}
                            </div>
                            <div class="flex items-center gap-2 mt-1">
                              <span class="text-[10px] sm:text-xs bg-indigo-100 dark:bg-indigo-950 text-indigo-700 dark:text-indigo-300 px-1.5 py-0.5 rounded font-medium">🔄 ${r.freq}${dayLabel}</span>
                              <span class="text-xs sm:text-sm ${isDoneToday ? 'text-emerald-600 dark:text-emerald-400 font-bold' : isDueToday ? 'text-amber-600 font-medium' : 'text-slate-400'}">
                                ${isDoneToday ? '✓ 오늘 달성 완료!' : isDueToday ? '오늘 수행 대상' : '오늘 비대상'}
                              </span>
                            </div>
                          </div>
                        </div>
                        <div class="flex items-center gap-1.5">
                          <button onclick="toggleEditRoutine(${r.id})" class="text-xs sm:text-sm bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 text-slate-700 dark:text-slate-300 px-2.5 py-1 rounded">수정</button>
                          <button onclick="deleteRoutine(${r.id})" class="text-slate-400 hover:text-rose-500 text-xs sm:text-base px-2 py-1 font-bold">✕</button>
                        </div>
                      </div>
                    `}
                  </li>
                `;
              }).join('')}
            </ul>
          `}
        </div>
      `;
    }

    initApp();
  </script>
</body>
</html>
