<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>할 일 관리</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Firebase SDK 모듈 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get, remove, child, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // 🔴 본인의 Firebase 설정값이 있다면 아래에 입력해 주세요. (미입력 시 로컬 저장소 모드로 작동)
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    try {
      if (firebaseConfig.apiKey !== "YOUR_API_KEY") {
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.firebaseDb = db;
        window.dbRef = ref;
        window.dbSet = set;
        window.dbGet = get;
        window.dbRemove = remove;
        window.dbChild = child;
        window.dbOnValue = onValue;
      }
    } catch (e) {
      console.warn("Firebase Config 오류 - 로컬 모드로 작동합니다:", e);
    }

    window.dispatchEvent(new Event('firebase-ready'));
  </script>

  <style>
    .touch-target { min-height: 44px; min-width: 44px; }
    .swipe-item { transition: transform 0.2s ease-out; touch-action: pan-y; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 p-3 sm:p-8 pb-28 sm:pb-8">

  <!-- 1. 로그인 / 회원가입 / 관리자 진입 화면 -->
  <div id="loginScreen" class="max-w-md mx-auto mt-8 sm:mt-12 bg-white rounded-2xl shadow-xl p-6 sm:p-8 border border-slate-100">
    <div class="text-center mb-6">
      <div class="w-12 h-12 bg-indigo-100 text-indigo-600 rounded-2xl flex items-center justify-center mx-auto mb-3 text-xl font-bold">📝</div>
      <h2 class="text-2xl font-bold text-slate-800">할 일 관리</h2>
      <p class="text-xs text-slate-500 mt-1">아이디와 비밀번호로 로그인하세요.</p>
    </div>

    <!-- 탭 선택 (로그인 vs 회원가입) -->
    <div class="flex border-b border-slate-200 mb-6">
      <button id="tabLogin" type="button" onclick="switchAuthTab('login')" class="flex-1 py-2.5 text-center font-semibold text-indigo-600 border-b-2 border-indigo-600 text-sm">로그인</button>
      <button id="tabRegister" type="button" onclick="switchAuthTab('register')" class="flex-1 py-2.5 text-center font-semibold text-slate-400 border-b-2 border-transparent hover:text-slate-600 text-sm">회원가입</button>
    </div>

    <!-- 로그인 폼 -->
    <form id="loginForm" onsubmit="handleLoginSubmit(event)" class="space-y-4">
      <div id="accountListContainer" class="hidden mb-4">
        <p class="text-xs font-semibold text-slate-600 mb-2">최근 접속 계정</p>
        <div id="accountList" class="flex flex-wrap gap-2"></div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">아이디</label>
        <input type="text" id="loginUsername" placeholder="아이디 입력" required
               class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-slate-50 text-sm">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">비밀번호</label>
        <input type="password" id="loginPassword" placeholder="비밀번호 입력" required
               class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-slate-50 text-sm">
      </div>
      <button type="submit" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl transition text-sm shadow-md shadow-indigo-100 touch-target">
        로그인
      </button>

      <div class="text-center pt-2">
        <button type="button" onclick="openAdminPrompt()" class="text-xs text-slate-400 hover:text-indigo-600 underline">
          ⚙️ 관리자 모드
        </button>
      </div>
    </form>

    <!-- 회원가입 폼 -->
    <form id="registerForm" onsubmit="handleRegisterSubmit(event)" class="space-y-4 hidden">
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">새 아이디</label>
        <input type="text" id="regUsername" placeholder="사용할 아이디 (예: 선홍)" required
               class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-slate-50 text-sm">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">비밀번호</label>
        <input type="password" id="regPassword" placeholder="비밀번호 설정" required
               class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-slate-50 text-sm">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">비밀번호 확인</label>
        <input type="password" id="regPasswordConfirm" placeholder="비밀번호 재입력" required
               class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-slate-50 text-sm">
      </div>
      <button type="submit" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-xl transition text-sm shadow-md shadow-emerald-100 touch-target">
        가입하기
      </button>
    </form>
  </div>

  <!-- 🛠️ 관리자 전용 화면 -->
  <div id="adminScreen" class="hidden max-w-2xl mx-auto bg-white rounded-2xl shadow-xl p-4 sm:p-6 border border-slate-200 mt-6">

    <p class="text-xs text-slate-500 mb-4">등록된 회원들의 아이디 및 비밀번호를 수정하거나 삭제할 수 있습니다.</p>

    <div class="overflow-x-auto">
      <table class="w-full text-left border-collapse">

  <!-- 2. 메인 서비스 화면 -->
  <div id="mainScreen" class="hidden max-w-2xl mx-auto bg-white rounded-2xl shadow-xl p-4 sm:p-6">
    <!-- 헤더 영역 -->

        <div class="flex items-center gap-2">

          <button onclick="handleLogout()" class="text-xs text-slate-400 hover:text-slate-600 underline">로그아웃</button>

      <div class="flex items-center gap-2 self-start sm:self-auto flex-wrap">

    <!-- PC/대화면 전용 입력 폼 -->

        <button type="button" id="btnPc_tomorrow17" onclick="setQuickTime('tomorrow17', 'pc')" class="quick-chip-pc px-3 py-1.5 rounded-full font-medium text-xs flex-shrink-0 transition border border-slate-200 bg-slate-100 text-slate-600 hover:bg-slate-200">내일 17시</button>
        <button type="button" id="btnPc_1h" onclick="setQuickTime(1, 'pc')" class="quick-chip-pc px-3 py-1.5 rounded-full font-medium text-xs flex-shrink-0 transition border border-slate-200 bg-slate-100 text-slate-600 hover:bg-slate-200">+1시간</button>
      </div>

      <form id="todoFormPc" onsubmit="addTodo(event, 'pc')" class="space-y-3">
        <input type="text" id="taskInputPc" placeholder="새 할 일을 입력하세요..." required
               class="w-full px-4 py-2.5 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white text-sm">
        
        <div class="flex flex-wrap gap-2 items-center">
          <input type="datetime-local" id="timeInputPc" step="600"
                 class="flex-1 min-w-[180px] px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
          
          <select id="categoryInputPc" class="px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">

            <option value="개인">👤 개인</option>

          <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-5 py-2 rounded-xl transition text-sm shadow-md shadow-indigo-100">추가</button>

    <!-- 탭 메뉴 (All / Today) & 컨트롤 바 -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between border-b border-slate-200 mb-4 sm:mb-6 gap-2">
      <div class="flex flex-1">
        <button id="tabAll" onclick="switchTab('all')" class="flex-1 sm:flex-initial sm:px-8 py-2.5 text-center font-semibold text-indigo-600 border-b-2 border-indigo-600 transition text-sm sm:text-base">📋 All</button>
        <button id="tabToday" onclick="switchTab('today')" class="flex-1 sm:flex-initial sm:px-8 py-2.5 text-center font-semibold text-slate-400 border-b-2 border-transparent hover:text-slate-600 transition text-sm sm:text-base">📅 Today</button>
      </div>

      <div class="flex items-center justify-between sm:justify-end gap-3 pb-2 sm:pb-0">
        <button id="hideCompletedBtn" onclick="toggleHideCompleted()" class="text-xs text-slate-600 bg-slate-100 hover:bg-slate-200 px-2.5 py-1.5 rounded-lg font-medium transition">
          👁️ 완료 숨기기
        </button>

        <div id="sortContainer" class="flex items-center gap-1">
          <span class="text-xs text-slate-400">정렬:</span>
          <select id="sortInput" onchange="changeSortOrder(this.value)" class="text-xs bg-slate-50 border border-slate-200 rounded-lg px-2 py-1.5 text-slate-600 font-medium focus:outline-none">
            <option value="createdAt">🆕 최신순</option>
            <option value="dueDate">⏰ 마감순</option>
          </select>
        </div>
      </div>
    </div>

    <!-- 할 일 목록 렌더링 영역 -->
    <div id="todoContainer">
      <ul id="todoList" class="space-y-3"></ul>
    </div>
  </div>

  <!-- 모바일 전용 하단 고정 스티키 입력바 -->
  <div class="block sm:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 shadow-2xl p-3 z-40">
    <div class="flex items-center gap-1.5 mb-2 overflow-x-auto pb-1 text-xs">
      <span class="text-[11px] font-semibold text-slate-400 flex-shrink-0">빠른 마감:</span>
      <button type="button" id="btnMobile_today11" onclick="setQuickTime('today11', 'mobile')" class="quick-chip-mobile px-3 py-1 rounded-full font-medium text-xs flex-shrink-0 transition border border-slate-200 bg-slate-100 text-slate-600 hover:bg-slate-200">오늘 11시</button>
      <button type="button" id="btnMobile_today17" onclick="setQuickTime('today17', 'mobile')" class="quick-chip-mobile px-3 py-1 rounded-full font-medium text-xs flex-shrink-0 transition border border-slate-200 bg-slate-100 text-slate-600 hover:bg-slate-200">오늘 17시</button>
      <button type="button" id="btnMobile_tomorrow11" onclick="setQuickTime('tomorrow11', 'mobile')" class="quick-chip-mobile px-3 py-1 rounded-full font-medium text-xs flex-shrink-0 transition border border-slate-200 bg-slate-100 text-slate-600 hover:bg-slate-200">내일 11시</button>
      <button type="button" id="btnMobile_tomorrow17" onclick="setQuickTime('tomorrow17', 'mobile')" class="quick-chip-mobile px-3 py-1 rounded-full font-medium text-xs flex-shrink-0 transition border border-slate-200 bg-slate-100 text-slate-600 hover:bg-slate-200">내일 17시</button>
      <button type="button" id="btnMobile_1h" onclick="setQuickTime(1, 'mobile')" class="quick-chip-mobile px-3 py-1 rounded-full font-medium text-xs flex-shrink-0 transition border border-slate-200 bg-slate-100 text-slate-600 hover:bg-slate-200">+1시간</button>
    </div>

    <form id="todoFormMobile" onsubmit="addTodo(event, 'mobile')" class="flex items-center gap-2">
      <input type="text" id="taskInputMobile" placeholder="할 일 입력..." required
             class="flex-1 px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-slate-50">
      
      <select id="categoryInputMobile" class="px-2 py-2.5 border border-slate-200 rounded-xl text-xs bg-slate-50 font-medium">
        <option value="업무">🏢</option>
        <option value="개인">👤</option>
        <option value="기타">📌</option>
      </select>

      <input type="datetime-local" id="timeInputMobile" step="600" class="hidden">

      <button type="submit" class="bg-indigo-600 text-white font-semibold px-4 py-2.5 rounded-xl text-sm shadow-md shadow-indigo-100 touch-target flex-shrink-0">
        등록

  <script>
    let currentUser = localStorage.getItem('sunhong_todo_user') || '';
    let savedAccounts = JSON.parse(localStorage.getItem('sunhong_todo_accounts') || '[]');
    let localUsers = JSON.parse(localStorage.getItem('sunhong_todo_user_db') || '{}');
    let todos = [];
    let currentTab = 'all';
    let currentSort = 'createdAt';
    let hideCompleted = false;
    let swRegistration = null;

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').then(reg => { 
        swRegistration = reg;
        updateNotificationUI();
      }).catch(err => console.log('SW 등록 실패:', err));
    }

    window.addEventListener('firebase-ready', () => {
      if (currentUser) {
        setupFirebaseListener();
      }
    });

    /* 🔐 비밀번호 기반 로그인/회원가입 제어 */
    function switchAuthTab(tab) {
      const tabLogin = document.getElementById('tabLogin');
      const tabRegister = document.getElementById('tabRegister');
      const loginForm = document.getElementById('loginForm');
      const registerForm = document.getElementById('registerForm');

      if (tab === 'login') {
        tabLogin.className = "flex-1 py-2.5 text-center font-semibold text-indigo-600 border-b-2 border-indigo-600 text-sm";
        tabRegister.className = "flex-1 py-2.5 text-center font-semibold text-slate-400 border-b-2 border-transparent hover:text-slate-600 text-sm";
        loginForm.classList.remove('hidden');
        registerForm.classList.add('hidden');
      } else {
        tabRegister.className = "flex-1 py-2.5 text-center font-semibold text-indigo-600 border-b-2 border-indigo-600 text-sm";
        tabLogin.className = "flex-1 py-2.5 text-center font-semibold text-slate-400 border-b-2 border-transparent hover:text-slate-600 text-sm";
        registerForm.classList.remove('hidden');
        loginForm.classList.add('hidden');
      }
    }

    async function handleRegisterSubmit(e) {
      e.preventDefault();
      const username = document.getElementById('regUsername').value.trim();
      const password = document.getElementById('regPassword').value;
      const confirmPassword = document.getElementById('regPasswordConfirm').value;

      if (!username || !password) return;
      if (password !== confirmPassword) {
        alert('비밀번호가 일치하지 않습니다.');
        return;
      }

      try {
        if (window.firebaseDb) {
          // Firebase DB 가입 처리 및 중복 검사
          const userRef = window.dbRef(window.firebaseDb, `users/${username}`);
          const snapshot = await window.dbGet(userRef);

          if (snapshot.exists()) {
            alert('이미 존재하는 아이디입니다.');
            return;
          }
          await window.dbSet(userRef, { password: password, createdAt: Date.now() });
        } else {
          // Firebase 미연동 시 로컬 저장소 중복 검사
          if (localUsers[username]) {
            alert('이미 존재하는 아이디입니다.');
            return;
          }
          localUsers[username] = password;
          localStorage.setItem('sunhong_todo_user_db', JSON.stringify(localUsers));
        }

        if (!savedAccounts.includes(username)) {
          savedAccounts.push(username);
          localStorage.setItem('sunhong_todo_accounts', JSON.stringify(savedAccounts));
        }

        alert('🎉 가입이 완료되었습니다! 로그인해 주세요.');
        document.getElementById('regUsername').value = '';
        document.getElementById('regPassword').value = '';
        document.getElementById('regPasswordConfirm').value = '';

        switchAuthTab('login');
        fillUsername(username);
      } catch (err) {
        alert('회원가입 처리 중 오류가 발생했습니다: ' + err.message);
      }
    }

    async function handleLoginSubmit(e) {
      e.preventDefault();
      const username = document.getElementById('loginUsername').value.trim();
      const password = document.getElementById('loginPassword').value;

      if (!username || !password) return;

      try {
        let isSuccess = false;

        if (window.firebaseDb) {
          const userRef = window.dbRef(window.firebaseDb, `users/${username}`);
          const snapshot = await window.dbGet(userRef);

          if (!snapshot.exists()) {
            alert('존재하지 않는 아이디입니다.');
            return;
          }
          const userData = snapshot.val();
          if (userData.password === password) {
            isSuccess = true;
          }
        } else {
          if (localUsers[username] && localUsers[username] === password) {
            isSuccess = true;
          }
        }

        if (!isSuccess) {
          alert('비밀번호가 올바르지 않습니다.');
          return;
        }

        if (!savedAccounts.includes(username)) {
          savedAccounts.push(username);
          localStorage.setItem('sunhong_todo_accounts', JSON.stringify(savedAccounts));
        }

        currentUser = username;
        localStorage.setItem('sunhong_todo_user', currentUser);
        initApp();
      } catch (err) {
        alert('로그인 시도 중 오류가 발생했습니다: ' + err.message);
      }
    }

    function fillUsername(username) {
      document.getElementById('loginUsername').value = username;
      document.getElementById('loginPassword').focus();
    }

    /* ⚙️ 관리자 모드 제어 */
    function openAdminPrompt() {
      const input = prompt("관리자 비밀번호를 입력하세요:");
      if (input === "전선홍관리자") {
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('adminScreen').classList.remove('hidden');
        loadAdminUserList();
      } else if (input !== null) {
        alert("비밀번호가 올바르지 않습니다.");
      }

    async function adminDeleteUser(uname) {
      if (!confirm(`정말로 [${uname}] 계정을 삭제하시겠습니까? 데이터는 복구되지 않습니다.`)) return;

      if (window.firebaseDb) {
        const userRef = window.dbRef(window.firebaseDb, `users/${uname}`);
        const userTodosRef = window.dbRef(window.firebaseDb, `todos/${uname}`);
        await window.dbRemove(userRef);
        await window.dbRemove(userTodosRef);
      } else {
        delete localUsers[uname];
        localStorage.setItem('sunhong_todo_user_db', JSON.stringify(localUsers));
      }

      savedAccounts = savedAccounts.filter(a => a !== uname);
      localStorage.setItem('sunhong_todo_accounts', JSON.stringify(savedAccounts));

      alert(`[${uname}] 계정이 삭제되었습니다.`);
      loadAdminUserList();
    }

    function addToGoogleCalendar(taskTitle, category, dueString) {
      let startDateStr, endDateStr;

      if (dueString && dueString.includes('T')) {
        const start = new Date(dueString);
        const end = new Date(start.getTime() + 30 * 60 * 1000);
        
        startDateStr = start.toISOString().replace(/-|:|\.\d\d\d/g, "");
        endDateStr = end.toISOString().replace(/-|:|\.\d\d\d/g, "");
      } else {
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        const dateFormatted = `${year}${month}${day}`;
        startDateStr = dateFormatted;
        endDateStr = dateFormatted;
      }

      const titleParam = encodeURIComponent(`[${category || '할일'}] ${taskTitle}`);
      const detailsParam = encodeURIComponent(`할 일 웹 앱에서 추가된 일정입니다.`);
      
      const gcalUrl = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${titleParam}&dates=${startDateStr}/${endDateStr}&details=${detailsParam}`;
      window.open(gcalUrl, '_blank');
    }

    function handleNotificationClick() {
      if (!('Notification' in window)) {
        alert('이 브라우저는 웹 알림을 지원하지 않습니다.');
        return;
      }

      if (Notification.permission === 'granted') {

      } else {

          if (permission === 'granted') {
            triggerNotification("🎉 알림 활성화 완료", "이제 마감 10분 전 및 마감 정시에 알림이 발송됩니다.");

    function triggerNotification(title, body) {
      if (Notification.permission !== 'granted') return;

      if (navigator.serviceWorker && navigator.serviceWorker.controller) {
        navigator.serviceWorker.controller.postMessage({
          type: 'SHOW_NOTIFICATION',
          title: title,
          body: body
        });
      } else if (swRegistration && swRegistration.showNotification) {
        swRegistration.showNotification(title, {
          body: body,
          icon: 'https://cdn-icons-png.flaticon.com/512/906/906334.png'
        });
      } else {
        new Notification(title, { body: body });
      }
    }

    function checkDueNotifications() {
      if (Notification.permission !== 'granted' || !todos.length) return;

      const now = new Date();
      let updated = false;

      todos.forEach(t => {
        if (!t.completed && t.due) {
          const dueTime = new Date(t.due);
          const diffMinutes = (dueTime - now) / (1000 * 60);

          if (diffMinutes > 0 && diffMinutes <= 10 && !t.notified10m) {
            triggerNotification("⏰ 마감 10분 전!", `[${t.category}] ${t.task} 마감 10분 전입니다.`);
            t.notified10m = true;
            updated = true;
          }

          if (now >= dueTime && (now - dueTime) < 10 * 60 * 1000 && !t.notified) {
            triggerNotification("🔥 마감 시간이 되었습니다!", `[${t.category}] ${t.task} 마감 시각이 되었습니다.`);
            t.notified = true;
            t.notified10m = true;
            updated = true;
          }
        }

        if (t.subitems && t.subitems.length > 0) {
          t.subitems.forEach(s => {
            if (!s.completed && s.due) {
              const subDueTime = new Date(s.due);
              const subDiffMinutes = (subDueTime - now) / (1000 * 60);

              if (subDiffMinutes > 0 && subDiffMinutes <= 10 && !s.notified10m) {
                triggerNotification("⏰ 하위 할 일 10분 전!", `[하위] ${s.task} 마감 10분 전입니다.`);
                s.notified10m = true;
                updated = true;
              }

              if (now >= subDueTime && (now - subDueTime) < 10 * 60 * 1000 && !s.notified) {
                triggerNotification("🔥 하위 할 일 마감!", `[하위] ${s.task} 마감 시각이 되었습니다.`);
                s.notified = true;
                s.notified10m = true;
                updated = true;
              }
            }
          });
        }
      });

      if (updated) {
        saveAndRender();
      }
    }
    setInterval(checkDueNotifications, 3000);

    function getTodayString() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function getOneHourLaterString() {
      const now = new Date();
      now.setHours(now.getHours() + 1);
      const mins = Math.ceil(now.getMinutes() / 10) * 10;
      now.setMinutes(mins);
      now.setSeconds(0);

      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');

      return `${year}-${month}-${day}T${hours}:${minutes}`;
    }

    function setQuickTime(type, mode = 'pc') {
      const now = new Date();
      let targetDate = new Date();
      let chipKey = '';

      if (type === 'today11') {
        targetDate.setHours(11, 0, 0, 0);
        chipKey = 'today11';
      } else if (type === 'today17') {
        targetDate.setHours(17, 0, 0, 0);
        chipKey = 'today17';
      } else if (type === 'tomorrow11') {
        targetDate.setDate(now.getDate() + 1);
        targetDate.setHours(11, 0, 0, 0);
        chipKey = 'tomorrow11';
      } else if (type === 'tomorrow17') {
        targetDate.setDate(now.getDate() + 1);
        targetDate.setHours(17, 0, 0, 0);
        chipKey = 'tomorrow17';
      } else if (type === 1) {
        targetDate.setHours(now.getHours() + 1);
        chipKey = '1h';
      }

      const year = targetDate.getFullYear();
      const month = String(targetDate.getMonth() + 1).padStart(2, '0');
      const day = String(targetDate.getDate()).padStart(2, '0');
      const hours = String(targetDate.getHours()).padStart(2, '0');
      const minutes = String(targetDate.getMinutes()).padStart(2, '0');

      const timeStr = `${year}-${month}-${day}T${hours}:${minutes}`;

      if (mode === 'pc') {
        const inputPc = document.getElementById('timeInputPc');
        if (inputPc) inputPc.value = timeStr;
      } else {
        const inputMobile = document.getElementById('timeInputMobile');
        if (inputMobile) inputMobile.value = timeStr;
      }

      updateChipHighlight(chipKey, mode);
    }

    /* --- Firebase 실시간 동기화 --- */
    function setupFirebaseListener() {
      if (!window.firebaseDb || !currentUser) return;
      const userTodosRef = window.dbRef(window.firebaseDb, `todos/${currentUser}`);
      
      window.dbOnValue(userTodosRef, (snapshot) => {
        const data = snapshot.val();
        if (data) {
          todos = Array.isArray(data) ? data : Object.values(data);
          todos = todos.map(t => ({ ...t, subitems: t.subitems || [] }));
        } else {
          todos = [];
        }
        localStorage.setItem(`sunhong_todos_${currentUser}`, JSON.stringify(todos));
        render();
      });
    }

    function syncToFirebase() {
      if (!window.firebaseDb || !currentUser) return;
      const userTodosRef = window.dbRef(window.firebaseDb, `todos/${currentUser}`);
      window.dbSet(userTodosRef, todos);
    }

    function saveAndRender() {
      if (currentUser) {
        localStorage.setItem(`sunhong_todos_${currentUser}`, JSON.stringify(todos));
        syncToFirebase();
      }
      render();
    }

    function exportData() {
      if (!todos.length) { alert('백업할 데이터가 없습니다.'); return; }
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(todos, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `todo_backup_${currentUser}_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const importedTodos = JSON.parse(e.target.result);
          if (Array.isArray(importedTodos)) {
            todos = importedTodos;
            saveAndRender();
            alert('데이터가 성공적으로 복원되었습니다.');
          } else {
            alert('올바르지 않은 백업 파일 형식입니다.');
          }
        } catch (err) {
          alert('파일을 읽는 중 오류가 발생했습니다.');
        }
      };
      reader.readAsText(file);
    }

    function getDDayTag(dateString) {
      if (!dateString) return '';
      const now = new Date();
      now.setHours(0,0,0,0);
      const target = new Date(dateString);
      const targetDay = new Date(dateString);
      targetDay.setHours(0,0,0,0);

      const diffDays = Math.ceil((targetDay - now) / (1000 * 60 * 60 * 24));

      if (new Date() > target && diffDays <= 0) {
        return `<span class="text-xs font-bold bg-rose-100 text-rose-600 border border-rose-200 px-2 py-0.5 rounded-md animate-pulse">🔥 기한 초과</span>`;
      } else if (diffDays === 0) {
        return `<span class="text-xs font-bold bg-amber-100 text-amber-700 border border-amber-200 px-2 py-0.5 rounded-md">⚡ D-Day</span>`;
      } else if (diffDays > 0) {
        return `<span class="text-xs font-semibold bg-blue-50 text-blue-600 border border-blue-200 px-2 py-0.5 rounded-md">D-${diffDays}</span>`;
      } else {
        return `<span class="text-xs font-bold bg-rose-100 text-rose-600 border border-rose-200 px-2 py-0.5 rounded-md">🔥 기한 초과</span>`;
      }
    }

    function saveInlineSubitem(parentId) {
      const taskInput = document.getElementById(`subTaskInput_${parentId}`).value.trim();
      const dueInput = document.getElementById(`subDueInput_${parentId}`).value;
      if (!taskInput) return;

      todos = todos.map(t => {
        if (t.id === parentId) {
          if (!t.subitems) t.subitems = [];
          t.subitems.push({ id: Date.now(), task: taskInput, due: dueInput, completed: false, isEditing: false, notified: false, notified10m: false });
          t.isAddingSub = false;
        }
        return t;
      });
      saveAndRender();
    }

    function toggleEditMain(id) { todos = todos.map(t => t.id === id ? { ...t, isEditing: !t.isEditing } : t); render(); }

    function saveEditMain(id) {

      const categoryInput = document.getElementById(`editCategory_${id}`).value;
      const dueInput = document.getElementById(`editDue_${id}`) ? document.getElementById(`editDue_${id}`).value : '';

      if (!taskInput) return;
      todos = todos.map(t => t.id === id ? { ...t, task: taskInput, category: categoryInput, due: dueInput, notified: false, notified10m: false, isEditing: false } : t);

    function toggleEditSub(parentId, subId) {
      todos = todos.map(t => {
        if (t.id === parentId && t.subitems) t.subitems = t.subitems.map(s => s.id === subId ? { ...s, isEditing: !s.isEditing } : s);
        return t;
      });
      render();

    function saveEditSub(parentId, subId) {
      const taskInput = document.getElementById(`editSubTask_${subId}`).value.trim();
      const dueInput = document.getElementById(`editSubDue_${subId}`).value;
      if (!taskInput) return;
      todos = todos.map(t => {
        if (t.id === parentId && t.subitems) t.subitems = t.subitems.map(s => s.id === subId ? { ...s, task: taskInput, due: dueInput, notified: false, notified10m: false, isEditing: false } : s);
        return t;
      });
      saveAndRender();
    }

    function toggleSubitem(parentId, subId) {
      todos = todos.map(t => {
        if (t.id === parentId && t.subitems) {
          t.subitems = t.subitems.map(s => s.id === subId ? { ...s, completed: !s.completed } : s);
          t.completed = t.subitems.length > 0 && t.subitems.every(s => s.completed);
        }
        return t;
      });
      saveAndRender();
    }

    function toggleComplete(id) {
      todos = todos.map(t => {
        if (t.id === id) {
          t.completed = !t.completed;
          if (t.subitems && t.subitems.length > 0) t.subitems = t.subitems.map(s => ({ ...s, completed: t.completed }));
        }
        return t;
      });
      saveAndRender();
    }

    function deleteTodo(id) { todos = todos.filter(t => t.id !== id); saveAndRender(); }
    function deleteSubitem(parentId, subId) {
      todos = todos.map(t => { if (t.id === parentId && t.subitems) t.subitems = t.subitems.filter(s => s.id !== subId); return t; });
      saveAndRender();
    }

    function isToday(dateString) {
      if (!dateString) return false;
      const todayStr = getTodayString();
      return dateString.startsWith(todayStr);
    }

    function getEarliestDue(todo) {
      if (todo.due) return todo.due;
      if (todo.subitems && todo.subitems.length > 0) {
        const dues = todo.subitems.map(s => s.due).filter(Boolean).sort();
        if (dues.length > 0) return dues[0];
      }
      return '9999-99-99';
    }

    function switchTab(tab) {
      currentTab = tab;
      const tabAll = document.getElementById('tabAll');
      const tabToday = document.getElementById('tabToday');
      const sortContainer = document.getElementById('sortContainer');

      if (tab === 'all') {
        tabAll.className = "flex-1 sm:flex-initial sm:px-8 py-2.5 text-center font-semibold text-indigo-600 border-b-2 border-indigo-600 text-sm sm:text-base";
        tabToday.className = "flex-1 sm:flex-initial sm:px-8 py-2.5 text-center font-semibold text-slate-400 border-b-2 border-transparent hover:text-slate-600 text-sm sm:text-base";
        sortContainer.classList.remove('hidden');
      } else {
        tabToday.className = "flex-1 sm:flex-initial sm:px-8 py-2.5 text-center font-semibold text-indigo-600 border-b-2 border-indigo-600 text-sm sm:text-base";
        tabAll.className = "flex-1 sm:flex-initial sm:px-8 py-2.5 text-center font-semibold text-slate-400 border-b-2 border-transparent hover:text-slate-600 text-sm sm:text-base";
        sortContainer.classList.add('hidden');
      }
      render();
    }

    function render() {
      const container = document.getElementById('todoContainer');
      if (!container) return;

      if (currentTab === 'all') {
        renderAllTab(container);
      } else {
        renderTodayTimelineTab(container);
      }
    }

    /* 1. All 탭 렌더링 */
    function renderAllTab(container) {
      let filteredTodos = [...todos];

      if (hideCompleted) {
        filteredTodos = filteredTodos.filter(t => !t.completed);
      }

      if (currentSort === 'dueDate') filteredTodos.sort((a, b) => getEarliestDue(a).localeCompare(getEarliestDue(b)));
      else filteredTodos.sort((a, b) => b.id - a.id);

      if (filteredTodos.length === 0) {
        container.innerHTML = `<ul class="space-y-3"><li class="text-center py-10 text-slate-400 text-sm">등록된 할 일이 없습니다.</li></ul>`;
        return;
      }

      container.innerHTML = `<ul class="space-y-3">${filteredTodos.map(t => {
        const hasSub = t.subitems && t.subitems.length > 0;
        const totalSub = hasSub ? t.subitems.length : 0;
        const compSub = hasSub ? t.subitems.filter(s => s.completed).length : 0;
        const prog = hasSub ? Math.round((compSub / totalSub) * 100) : 0;

        return `
          <li class="bg-slate-50 border border-slate-200/80 rounded-xl p-3.5 sm:p-4 shadow-sm transition ${t.completed ? 'opacity-60 bg-slate-100/50' : ''}">
            ${t.isEditing ? `
              <div class="space-y-3 bg-white p-3 rounded-xl border border-indigo-200">
                <input type="text" id="editTask_${t.id}" value="${t.task}" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg">
                <div class="flex flex-wrap items-center gap-2">
                  <select id="editCategory_${t.id}" class="px-2.5 py-1.5 text-xs border border-slate-300 rounded-lg bg-white">
                    <option value="업무" ${t.category === '업무' ? 'selected' : ''}>🏢 업무</option>
                    <option value="개인" ${t.category === '개인' ? 'selected' : ''}>👤 개인</option>
                    <option value="기타" ${t.category === '기타' ? 'selected' : ''}>📌 기타</option>
                  </select>
                  ${!hasSub ? `<input type="datetime-local" id="editDue_${t.id}" step="600" value="${t.due || ''}" class="flex-1 px-3 py-1.5 text-xs border border-slate-300 rounded-lg">` : `<span class="text-xs text-indigo-600 font-medium">그룹 할 일</span>`}
                  <button onclick="saveEditMain(${t.id})" class="px-3 py-1.5 bg-indigo-600 text-white text-xs rounded-lg">저장</button>
                  <button onclick="toggleEditMain(${t.id})" class="px-3 py-1.5 bg-slate-200 text-slate-600 text-xs rounded-lg">취소</button>
                </div>
              </div>
            ` : `
              <div class="flex items-start justify-between gap-3">
                <div class="flex items-start gap-3 flex-1">
                  <input type="checkbox" ${t.completed ? 'checked' : ''} onchange="toggleComplete(${t.id})" class="w-5 h-5 accent-indigo-600 rounded mt-0.5 touch-target">
                  <div class="flex-1">
                    <div class="flex items-center gap-2 flex-wrap">
                      <span class="font-semibold ${t.completed ? 'line-through text-slate-400' : 'text-slate-800'} text-sm sm:text-base">${t.task}</span>
                      <span class="text-xs bg-slate-200 px-2 py-0.5 rounded-md text-slate-600">${t.category}</span>
                      ${hasSub ? `<span class="text-xs font-semibold bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded-md">📂 그룹</span>` : ''}
                      ${!t.completed && t.due ? getDDayTag(t.due) : ''}
                    </div>
                    <div class="mt-1.5 text-xs text-slate-500">
                      ${hasSub ? `<div class="flex items-center gap-2 mt-1"><span class="font-medium text-indigo-600">완료율 ${prog}% (${compSub}/${totalSub})</span>
                        <div class="w-24 bg-slate-200 rounded-full h-1.5 overflow-hidden"><div class="bg-indigo-600 h-1.5" style="width: ${prog}%"></div></div></div>` 
                      : `${t.due ? `<span>⏰ ${new Date(t.due).toLocaleString('ko-KR', { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' })}</span>` : '<span class="text-slate-400">마감 없음</span>'}`}
                    </div>
                  </div>
                </div>
                <div class="flex items-center gap-1">
                  <button onclick="addToGoogleCalendar('${t.task.replace(/'/g, "\\'")}', '${t.category}', '${t.due || ''}')" title="구글 캘린더에 추가" class="text-xs bg-blue-50 hover:bg-blue-100 text-blue-600 p-2 rounded-lg touch-target flex items-center gap-1 font-medium">📅</button>
                  <button onclick="toggleEditMain(${t.id})" class="text-xs bg-slate-200 hover:bg-slate-300 text-slate-700 p-2 rounded-lg touch-target">✏️</button>
                  <button onclick="toggleAddSubForm(${t.id})" class="text-xs bg-indigo-50 hover:bg-indigo-100 text-indigo-600 px-2.5 py-2 rounded-lg touch-target">+ 하위</button>
                  <button onclick="deleteTodo(${t.id})" class="text-slate-400 hover:text-red-500 p-2 text-xs touch-target">✕</button>
                </div>
              </div>
            `}

            ${t.isAddingSub ? `
              <div class="mt-3 sm:ml-6 p-3 bg-indigo-50/60 rounded-xl border border-indigo-100 space-y-2">
                <input type="text" id="subTaskInput_${t.id}" placeholder="하위 할 일 내용" onkeydown="if(event.key==='Enter') saveInlineSubitem(${t.id})"
                       class="w-full px-3 py-2 text-xs border border-indigo-200 rounded-lg">
                <div class="flex gap-2">
                  <input type="datetime-local" id="subDueInput_${t.id}" step="600" class="flex-1 px-2 py-1.5 text-xs border border-indigo-200 rounded-lg">
                  <button onclick="saveInlineSubitem(${t.id})" class="px-3 py-1.5 bg-indigo-600 text-white text-xs rounded-lg">추가</button>
                  <button onclick="toggleAddSubForm(${t.id})" class="px-3 py-1.5 bg-slate-200 text-slate-600 text-xs rounded-lg">취소</button>
                </div>
              </div>
            ` : ''}

            ${hasSub ? `
              <ul class="mt-3 pl-3 sm:pl-6 border-l-2 border-indigo-100 space-y-2">
                ${t.subitems.map(s => `
                  <li class="py-1">
                    ${s.isEditing ? `
                      <div class="flex items-center gap-2 bg-white p-2 rounded-lg border border-indigo-200">
                        <input type="text" id="editSubTask_${s.id}" value="${s.task}" class="flex-1 px-2 py-1 text-xs border border-slate-300 rounded">
                        <input type="datetime-local" id="editSubDue_${s.id}" step="600" value="${s.due || ''}" class="px-2 py-1 text-xs border border-slate-300 rounded">
                        <button onclick="saveEditSub(${t.id}, ${s.id})" class="px-2 py-1 bg-indigo-600 text-white text-xs rounded">저장</button>
                        <button onclick="toggleEditSub(${t.id}, ${s.id})" class="px-2 py-1 bg-slate-200 text-slate-600 text-xs rounded">취소</button>
                      </div>
                    ` : `
                      <div class="flex items-center justify-between text-sm">
                        <div class="flex items-center gap-2.5">
                          <input type="checkbox" ${s.completed ? 'checked' : ''} onchange="toggleSubitem(${t.id}, ${s.id})" class="w-4 h-4 accent-indigo-600 rounded">
                          <span class="${s.completed ? 'line-through text-slate-400' : 'text-slate-700'}">${s.task}</span>
                          ${!s.completed && s.due ? getDDayTag(s.due) : ''}
                          ${s.due ? `<span class="text-xs text-slate-400">⏰ ${new Date(s.due).toLocaleString('ko-KR', { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' })}</span>` : ''}
                        </div>
                        <div class="flex items-center gap-1">
                          <button onclick="addToGoogleCalendar('${s.task.replace(/'/g, "\\'")}', '하위할일', '${s.due || ''}')" title="구글 캘린더에 추가" class="text-xs text-blue-500 hover:text-blue-700 p-1">📅</button>
                          <button onclick="toggleEditSub(${t.id}, ${s.id})" class="text-xs text-slate-400 hover:text-slate-600 p-1">✏️</button>
                          <button onclick="deleteSubitem(${t.id}, ${s.id})" class="text-xs text-slate-300 hover:text-red-400 p-1">✕</button>
                        </div>
                      </div>
                    `}
                  </li>
                `).join('')}
              </ul>
            ` : ''}
          </li>
        `;
      }).join('')}</ul>`;
    }

    /* 2. Today 탭 (타임라인) 렌더링 */
    function renderTodayTimelineTab(container) {
      const currentHour = new Date().getHours();
      
      let todayItems = [];
      todos.forEach(t => {
        if (hideCompleted && t.completed) return;

        const isMainToday = isToday(t.due);
        if (isMainToday) {
          todayItems.push({ ...t, isSub: false, parentId: null });
        }

        if (t.subitems && t.subitems.length > 0) {
          t.subitems.forEach(s => {
            if (hideCompleted && s.completed) return;
            if (isToday(s.due)) {
              todayItems.push({ ...s, isSub: true, parentId: t.id, parentCategory: t.category });
            }
          });
        }
      });

      const hourlyMap = {};
      for (let h = 0; h < 24; h++) hourlyMap[h] = [];
      const noTimeItems = [];

      todayItems.forEach(item => {
        if (!item.due || !item.due.includes('T')) {
          noTimeItems.push(item);
        } else {
          const hour = parseInt(item.due.split('T')[1].split(':')[0], 10);
          if (hourlyMap[hour]) hourlyMap[hour].push(item);
          else noTimeItems.push(item);
        }
      });

      if (todayItems.length === 0) {
        container.innerHTML = `
          <div class="text-center py-12 bg-slate-50 border border-slate-200/80 rounded-2xl">
            <p class="text-slate-400 text-sm">📅 오늘 예정된 일정이 없습니다.</p>
          </div>
        `;
        return;
      }

      let html = `<div class="space-y-3">`;

      if (noTimeItems.length > 0) {
        html += `
          <div class="bg-indigo-50/50 border border-indigo-100 rounded-xl p-3">
            <h3 class="text-xs font-bold text-indigo-700 mb-2 flex items-center gap-1">📌 오늘 시간 미지정</h3>
            <div class="space-y-1.5 pl-2">
              ${noTimeItems.map(item => renderTimelineItemHtml(item)).join('')}
            </div>
          </div>
        `;
      }

      for (let h = 0; h < 24; h++) {
        const items = hourlyMap[h];
        const isCurrentHour = h === currentHour;

        if (items.length > 0 || isCurrentHour) {
          const hourLabel = `${String(h).padStart(2, '0')}:00`;

          html += `
            <div class="flex items-start gap-3 p-3 rounded-xl border transition ${isCurrentHour ? 'bg-blue-50/60 border-blue-300 ring-2 ring-blue-200' : 'bg-slate-50/70 border-slate-200/70'}">
              <div class="w-14 text-xs font-bold ${isCurrentHour ? 'text-blue-600' : 'text-slate-500'} flex flex-col items-start pt-0.5">
                <span>${hourLabel}</span>
                ${isCurrentHour ? `<span class="text-[10px] bg-blue-600 text-white px-1 py-0.5 rounded mt-1">LIVE</span>` : ''}
              </div>
              <div class="flex-1 min-h-[28px] space-y-2">
                ${items.length > 0 ? items.map(item => renderTimelineItemHtml(item)).join('') : `<span class="text-xs text-slate-300 italic">현재 시각 (일정 없음)</span>`}
              </div>
            </div>
          `;
        }
      }

      html += `</div>`;
      container.innerHTML = html;
    }

    function renderTimelineItemHtml(item) {
      const dueTimeStr = item.due && item.due.includes('T') ? item.due.split('T')[1] : '';
      if (item.isSub) {
        return `
          <div class="flex items-center justify-between text-xs bg-white p-2.5 rounded-lg border border-slate-200 shadow-2xs">
            <div class="flex items-center gap-2">
              <input type="checkbox" ${item.completed ? 'checked' : ''} onchange="toggleSubitem(${item.parentId}, ${item.id})" class="w-4 h-4 accent-indigo-600 rounded">
              <span class="${item.completed ? 'line-through text-slate-400' : 'text-slate-700 font-medium'}">${item.task}</span>
              <span class="text-[10px] bg-indigo-50 text-indigo-600 px-1.5 py-0.5 rounded">하위</span>
            </div>
            <div class="flex items-center gap-1">
              ${dueTimeStr ? `<span class="text-[11px] font-semibold text-slate-500">⏰ ${dueTimeStr}</span>` : ''}
              <button onclick="addToGoogleCalendar('${item.task.replace(/'/g, "\\'")}', '하위할일', '${item.due || ''}')" title="구글 캘린더에 추가" class="text-xs text-blue-500 hover:text-blue-700 p-1">📅</button>
            </div>
          </div>
        `;
      } else {
        return `
          <div class="flex items-center justify-between text-xs bg-white p-2.5 rounded-lg border border-slate-200 shadow-2xs">
            <div class="flex items-center gap-2">
              <input type="checkbox" ${item.completed ? 'checked' : ''} onchange="toggleComplete(${item.id})" class="w-4 h-4 accent-indigo-600 rounded">
              <span class="${item.completed ? 'line-through text-slate-400' : 'text-slate-800 font-semibold'}">${item.task}</span>
              <span class="text-[10px] bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded">${item.category}</span>
            </div>
            <div class="flex items-center gap-1">
              ${dueTimeStr ? `<span class="text-[11px] font-bold text-indigo-600">⏰ ${dueTimeStr}</span>` : ''}
              <button onclick="addToGoogleCalendar('${item.task.replace(/'/g, "\\'")}', '${item.category}', '${item.due || ''}')" title="구글 캘린더에 추가" class="text-xs text-blue-500 hover:text-blue-700 p-1">📅</button>
            </div>
          </div>
        `;
      }
    }

    initApp();
  </script>
</body>
</html>
